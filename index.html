<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>郭春林 · 哲学与商业智慧 | 学习中心</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c11;--panel:#121722;--panel2:#161c28;--line:#232b3a;
  --text:#e9ecf3;--muted:#8b95a8;--gold:#e0b04d;--gold2:#f2d089;--green:#4ade80;
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 520px at 12% -6%, rgba(224,176,77,.14), transparent 62%),
    radial-gradient(760px 520px at 92% 0%, rgba(80,130,255,.10), transparent 62%),
    radial-gradient(700px 600px at 50% 110%, rgba(224,176,77,.05), transparent 60%);
}
.wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:0 20px}

/* ---------- HERO ---------- */
.hero{padding:56px 0 34px;text-align:center}
.eyebrow{
  display:inline-block;font-size:12px;letter-spacing:.28em;color:var(--gold);
  border:1px solid rgba(224,176,77,.35);border-radius:999px;padding:6px 16px 6px 20px;
  margin-bottom:20px;background:rgba(224,176,77,.06);
}
.hero h1{
  font-size:clamp(30px,5.4vw,52px);font-weight:800;letter-spacing:.04em;line-height:1.15;
  background:linear-gradient(120deg,#fff 10%,var(--gold2) 48%,#b9c6dd 96%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero .sub{margin-top:14px;color:var(--muted);font-size:15px;letter-spacing:.06em}
.stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:32px}
.stat{
  min-width:118px;background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:14px;padding:14px 20px;
}
.stat b{display:block;font-size:24px;font-weight:800;color:var(--gold2);letter-spacing:.02em}
.stat span{display:block;font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.1em}
.progress{max-width:520px;margin:26px auto 0;height:7px;background:#1a2130;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress .bar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--gold),#7fd6a5);transition:width .5s cubic-bezier(.22,1,.36,1)}
.progress-txt{margin-top:10px;font-size:13px;color:var(--muted);letter-spacing:.06em}

/* ---------- PATHS ---------- */
.section-title{
  display:flex;align-items:center;gap:12px;font-size:16px;font-weight:700;
  letter-spacing:.1em;color:#cdd5e4;margin:34px 0 16px;
}
.section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.path{
  text-align:left;cursor:pointer;background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:14px;padding:16px 18px;transition:.25s;color:var(--text);
  font-family:inherit;
}
.path:hover{transform:translateY(-3px);border-color:rgba(224,176,77,.45);box-shadow:0 12px 28px rgba(0,0,0,.45)}
.path.active{border-color:var(--gold);background:linear-gradient(160deg,rgba(224,176,77,.13),var(--panel))}
.path .p-name{font-size:15px;font-weight:700;letter-spacing:.04em}
.path .p-desc{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6}
.path .p-count{font-size:11px;color:var(--gold);letter-spacing:.14em;margin-top:10px;display:block}

/* ---------- TOOLBAR ---------- */
.toolbar{
  position:sticky;top:0;z-index:30;
  background:rgba(10,12,17,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:14px 0;margin:38px 0 24px;
}
.toolbar-inner{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.search-box{position:relative;flex:1 1 260px;min-width:200px}
.search-box input{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:11px;
  color:var(--text);font-size:14px;padding:11px 14px 11px 38px;outline:none;transition:.2s;
  font-family:inherit;
}
.search-box input:focus{border-color:rgba(224,176,77,.6);box-shadow:0 0 0 3px rgba(224,176,77,.1)}
.search-box input::placeholder{color:#5c6678}
.search-box .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#5c6678;font-size:14px}
select{
  background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--text);
  padding:11px 12px;font-size:13px;outline:none;cursor:pointer;font-family:inherit;
}
select:focus{border-color:rgba(224,176,77,.6)}
.btn-rand{
  background:linear-gradient(135deg,rgba(224,176,77,.2),rgba(224,176,77,.06));
  border:1px solid rgba(224,176,77,.45);color:var(--gold2);border-radius:11px;
  padding:11px 16px;font-size:13px;cursor:pointer;transition:.2s;font-family:inherit;white-space:nowrap;
}
.btn-rand:hover{background:rgba(224,176,77,.28)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{
  background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;
  padding:6px 14px;font-size:13px;cursor:pointer;transition:.2s;font-family:inherit;
}
.chip:hover{border-color:rgba(224,176,77,.5);color:var(--gold2)}
.chip.active{background:rgba(224,176,77,.15);border-color:var(--gold);color:var(--gold2);font-weight:600}
.chip small{opacity:.6;margin-left:5px;font-size:11px}

/* ---------- GRID ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:18px}
.card{
  position:relative;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;transition:transform .28s cubic-bezier(.22,1,.36,1),border-color .28s,box-shadow .28s,opacity .28s;
}
.card:hover{transform:translateY(-5px);border-color:rgba(224,176,77,.5);box-shadow:0 16px 36px rgba(0,0,0,.55)}
.card.dim{opacity:.18;filter:grayscale(.7)}
.card.done{border-color:rgba(74,222,128,.4)}
.card.done::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green);z-index:2;
}
.thumb{position:relative;display:block;aspect-ratio:16/9;overflow:hidden;
  background:linear-gradient(135deg,#1d2534,#0f141e);}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.22,1,.36,1)}
.card:hover .thumb img{transform:scale(1.06)}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12) 0%,rgba(0,0,0,.55) 100%);pointer-events:none}
.play{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:rgba(224,176,77,.92);color:#141414;font-size:15px;padding-left:3px;
  opacity:0;transition:.28s;z-index:2;
}
.card:hover .play{opacity:1;transform:translate(-50%,-50%) scale(1)}
.views{
  position:absolute;right:9px;bottom:9px;z-index:2;font-size:11.5px;color:#e6ebf5;
  background:rgba(0,0,0,.66);border-radius:6px;padding:3px 8px;backdrop-filter:blur(4px);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
.body{padding:14px 15px 15px;display:flex;flex-direction:column;gap:12px;flex:1}
.body h3{
  font-size:14.5px;font-weight:600;line-height:1.55;letter-spacing:.01em;color:#e3e8f2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:45px;
}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.tag{
  font-size:11px;color:var(--gold);letter-spacing:.06em;background:rgba(224,176,77,.1);
  border:1px solid rgba(224,176,77,.25);border-radius:6px;padding:3px 9px;white-space:nowrap;
}
.actions{display:flex;align-items:center;gap:6px}
.note-btn{
  background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;
  width:28px;height:24px;font-size:12px;cursor:pointer;transition:.2s;font-family:inherit;
  display:grid;place-items:center;line-height:1;
}
.note-btn:hover{border-color:var(--gold);color:var(--gold2)}
.note-btn.has-note{background:rgba(224,176,77,.14);border-color:rgba(224,176,77,.55);color:var(--gold2)}
.done-btn{
  background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;
  padding:4px 11px;font-size:11.5px;cursor:pointer;transition:.2s;font-family:inherit;white-space:nowrap;
}
.done-btn:hover{border-color:var(--gold);color:var(--gold2)}
.card.done .done-btn{background:rgba(74,222,128,.13);border-color:rgba(74,222,128,.5);color:var(--green);font-weight:600}
.empty{text-align:center;padding:70px 20px;color:var(--muted);font-size:14px;letter-spacing:.08em;grid-column:1/-1}
.empty b{display:block;font-size:34px;margin-bottom:12px;opacity:.4}

/* ---------- FAB ---------- */
.fab{
  position:fixed;right:26px;bottom:26px;z-index:60;
  background:linear-gradient(135deg,rgba(224,176,77,.95),#c8952f);
  color:#141414;border:none;border-radius:999px;padding:14px 22px;
  font-size:14px;font-weight:700;letter-spacing:.06em;cursor:pointer;
  box-shadow:0 10px 30px rgba(224,176,77,.28);transition:.25s;font-family:inherit;
  display:flex;align-items:center;gap:9px;
}
.fab:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(224,176,77,.42)}
.fab .badge{
  background:#141414;color:var(--gold2);font-size:11px;font-weight:800;
  border-radius:999px;padding:2px 8px;min-width:22px;text-align:center;
}

/* ---------- OVERLAY + PANEL ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:.32s;z-index:70;
}
.overlay.open{opacity:1;pointer-events:auto}
.panel{
  position:fixed;top:0;right:0;bottom:0;width:min(460px,94vw);
  background:linear-gradient(180deg,#131926,#0e131c);
  border-left:1px solid var(--line);z-index:80;
  transform:translateX(102%);transition:transform .42s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;
}
.panel.open{transform:translateX(0)}
.panel-head{
  padding:20px 20px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.panel-head h2{font-size:16px;font-weight:700;letter-spacing:.1em;color:var(--gold2)}
.panel-head .close{
  background:transparent;border:1px solid var(--line);color:var(--muted);
  width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;
  display:grid;place-items:center;transition:.2s;font-family:inherit;line-height:1;
}
.panel-head .close:hover{border-color:var(--gold);color:var(--gold2)}

.rec-stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  padding:16px 20px;border-bottom:1px solid var(--line);
}
.rec-stat{text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 4px}
.rec-stat b{display:block;font-size:19px;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums}
.rec-stat span{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;letter-spacing:.08em}

.rec-tools{
  display:flex;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.rec-tools button, .rec-tools label{
  flex:1 1 auto;background:transparent;border:1px solid var(--line);color:var(--muted);
  border-radius:9px;padding:8px 12px;font-size:12px;cursor:pointer;transition:.2s;
  font-family:inherit;text-align:center;white-space:nowrap;
}
.rec-tools button:hover, .rec-tools label:hover{border-color:var(--gold);color:var(--gold2)}
.rec-tools .danger:hover{border-color:#e05d5d;color:#e05d5d}
.rec-tools input[type=file]{display:none}

.rec-body{flex:1;overflow-y:auto;padding:18px 20px 40px}
.rec-body::-webkit-scrollbar{width:7px}
.rec-body::-webkit-scrollbar-thumb{background:#2a3344;border-radius:99px}
.rec-body::-webkit-scrollbar-thumb:hover{background:#3a4558}

.rec-group{margin-bottom:24px}
.rec-date{
  display:flex;align-items:center;justify-content:space-between;
  font-size:11.5px;letter-spacing:.14em;color:var(--gold);margin-bottom:10px;
  padding-bottom:7px;border-bottom:1px dashed #232b3a;
}
.rec-date span{color:#5c6678;letter-spacing:.04em}
.rec-item{
  background:var(--panel2);border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;margin-bottom:9px;transition:.2s;
}
.rec-item:hover{border-color:rgba(224,176,77,.4)}
.rec-item h5{font-size:13px;font-weight:600;line-height:1.55;color:#dfe5f0;margin-bottom:7px}
.rec-note{
  font-size:12px;color:#a8b2c4;line-height:1.7;white-space:pre-wrap;
  border-left:2px solid rgba(224,176,77,.45);padding-left:10px;margin:8px 0 4px;
}
.rec-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}
.rec-time{font-size:11px;color:#5c6678;font-variant-numeric:tabular-nums}
.rec-foot a{font-size:11px;color:#7b8699;text-decoration:none;border-bottom:1px dotted #3a4558}
.rec-foot a:hover{color:var(--gold)}
.rec-blank{text-align:center;color:var(--muted);font-size:13px;padding:60px 20px;line-height:2}
.rec-blank b{display:block;font-size:32px;opacity:.35;margin-bottom:10px}

/* ---------- NOTE MODAL ---------- */
.modal{
  position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;
  background:rgba(0,0,0,.7);backdrop-filter:blur(5px);
  opacity:0;pointer-events:none;transition:.28s;
}
.modal.open{opacity:1;pointer-events:auto}
.modal-box{
  width:min(560px,100%);background:linear-gradient(180deg,#161d2b,#111722);
  border:1px solid var(--line);border-radius:16px;padding:22px;
  box-shadow:0 30px 80px rgba(0,0,0,.7);
  transform:translateY(14px) scale(.98);transition:.3s cubic-bezier(.22,1,.36,1);
}
.modal.open .modal-box{transform:translateY(0) scale(1)}
.modal-box h4{font-size:14px;font-weight:600;line-height:1.6;color:var(--gold2);margin-bottom:14px}
.modal-box textarea{
  width:100%;min-height:150px;resize:vertical;background:#0d121b;border:1px solid var(--line);
  border-radius:11px;color:var(--text);font-size:13.5px;line-height:1.8;padding:13px 15px;
  outline:none;font-family:inherit;transition:.2s;
}
.modal-box textarea:focus{border-color:rgba(224,176,77,.6);box-shadow:0 0 0 3px rgba(224,176,77,.09)}
.modal-box textarea::placeholder{color:#4d5769}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.modal-actions button{
  border-radius:10px;padding:9px 20px;font-size:13px;cursor:pointer;
  transition:.2s;font-family:inherit;border:1px solid var(--line);
}
.modal-actions .cancel{background:transparent;color:var(--muted)}
.modal-actions .cancel:hover{border-color:#5c6678;color:var(--text)}
.modal-actions .save{
  background:linear-gradient(135deg,rgba(224,176,77,.95),#c8952f);
  border-color:transparent;color:#141414;font-weight:700;
}
.modal-actions .save:hover{filter:brightness(1.08)}
.modal-actions .del{background:transparent;color:#e05d5d;border-color:rgba(224,93,93,.35);margin-right:auto}
.modal-actions .del:hover{background:rgba(224,93,93,.1)}

footer{margin-top:60px;text-align:center;color:#5c6678;font-size:12.5px;line-height:2;letter-spacing:.06em}
footer a{color:#7b8699;text-decoration:none}
footer a:hover{color:var(--gold)}

@media(max-width:640px){
  .hero{padding:38px 0 24px}
  .stats{gap:10px}
  .stat{min-width:calc(50% - 10px);padding:12px 14px;flex:1}
  .stat b{font-size:20px}
  .grid{grid-template-columns:1fr;gap:14px}
  .toolbar{margin:26px 0 18px}
  .fab{right:16px;bottom:16px;padding:12px 18px;font-size:13px}
  .rec-stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <span class="eyebrow">北大教授 · 哲学与商业智慧</span>
    <h1>郭春林 学习中心</h1>
    <p class="sub">把哲学思维，变成你人生的底层操作系统</p>

    <div class="stats">
      <div class="stat"><b id="s-videos">0</b><span>精选视频</span></div>
      <div class="stat"><b id="s-views">0</b><span>累计播放</span></div>
      <div class="stat"><b id="s-cats">0</b><span>主题分类</span></div>
      <div class="stat"><b id="s-done">0</b><span>已学记录</span></div>
    </div>

    <div class="progress"><div class="bar" id="bar"></div></div>
    <p class="progress-txt" id="ptxt">学习进度 0 / 0</p>
  </div>
</header>

<main class="wrap">

  <div class="section-title">推荐学习路径</div>
  <div class="paths" id="paths"></div>

  <div class="toolbar">
    <div class="toolbar-inner">
      <div class="search-box">
        <span class="ico">🔍</span>
        <input id="search" type="search" placeholder="搜索主题，如：命运 / 赚钱 / 领导力 / 焦虑  （按 / 快速聚焦）">
      </div>
      <select id="sort">
        <option value="hot">播放量 ↓</option>
        <option value="cold">播放量 ↑</option>
        <option value="title">标题排序</option>
        <option value="orig">原始顺序</option>
      </select>
      <button class="btn-rand" id="rand">🎲 随机一课</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    数据来源：YouTube 搜索「郭春林 哲学与商业智慧」结果 · 共去重 <span id="f-count">0</span> 条<br>
    点击封面跳转 YouTube 原视频 · 学习记录与笔记保存在本地浏览器
  </footer>

</main>

<!-- 学习记录悬浮按钮 -->
<button class="fab" id="fab">
  📖 学习记录 <span class="badge" id="fabBadge">0</span>
</button>

<!-- 遮罩 -->
<div class="overlay" id="overlay"></div>

<!-- 学习记录面板 -->
<aside class="panel" id="panel">
  <div class="panel-head">
    <h2>📖 学习记录</h2>
    <button class="close" id="panelClose" title="关闭">✕</button>
  </div>

  <div class="rec-stats">
    <div class="rec-stat"><b id="rs-today">0</b><span>今日学习</span></div>
    <div class="rec-stat"><b id="rs-week">0</b><span>近 7 天</span></div>
    <div class="rec-stat"><b id="rs-streak">0</b><span>连续天数</span></div>
    <div class="rec-stat"><b id="rs-total">0</b><span>累计记录</span></div>
  </div>

  <div class="rec-tools">
    <button id="btnExport">⬇ 导出备份</button>
    <label for="importFile">⬆ 导入备份</label>
    <input type="file" id="importFile" accept="application/json,.json">
    <button class="danger" id="btnClear">清空全部</button>
  </div>

  <div class="rec-body" id="recBody"></div>
</aside>

<!-- 笔记弹窗 -->
<div class="modal" id="noteModal">
  <div class="modal-box">
    <h4 id="nmTitle"></h4>
    <textarea id="nmText" placeholder="写下你的心得、金句、行动清单…（留空则只保存学习记录）"></textarea>
    <div class="modal-actions">
      <button class="del" id="nmDelete">删除记录</button>
      <button class="cancel" id="nmCancel">取消</button>
      <button class="save" id="nmSave">保存</button>
    </div>
  </div>
</div>

<script>
/* ========== 数据（标题 / 视频ID / 播放量 / 分类） ========== */
const RAW = [
["人这一生到底应该怎么活？郭春林老师带你参透人生真谛","2uD0LUO6O4s",5005,"人生哲思"],
["哲学入门：看不懂时代？告别迷茫焦虑","7rtKMBjAS6M",4988,"人生哲思"],

/* ========== 学习记录存储 ========== */
const KEY = "gcl_learn_v2";
const OLD_KEY = "gcl_learned_v1";
let records = {};   // { videoId: { at: 时间戳, note: "笔记" } }

(function loadRecords(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(p && typeof p === "object" && !Array.isArray(p)) records = p;
    } else {
      const old = localStorage.getItem(OLD_KEY);   // 从旧版本迁移
      if(old){
        const arr = JSON.parse(old);
        if(Array.isArray(arr)) arr.forEach(id => { records[id] = { at: Date.now(), note: "" }; });
        saveRecords();
      }
    }
  }catch(e){ records = {}; }
})();

function saveRecords(){
  try{ localStorage.setItem(KEY, JSON.stringify(records)); }catch(e){}
}

/* ========== 工具 ========== */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const dayKey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const timeStr = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtViews = n => n.toLocaleString("en-US");
const fmtShort = n => n >= 10000 ? (n/10000).toFixed(1) + "万" : n.toLocaleString("en-US");
function friendlyDate(key){
  const today = dayKey(Date.now());
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = dayKey(y.getTime());
  if(key === today) return "今天";
  if(key === yesterday) return "昨天";
  const [Y,M,D] = key.split("-");
  return `${Y} 年 ${+M} 月 ${+D} 日`;
}
function calcStreak(){
  const days = new Set(Object.values(records).map(r => dayKey(r.at)));
  if(!days.size) return 0;
  const d = new Date();
  if(!days.has(dayKey(d.getTime()))){
    d.setDate(d.getDate()-1);
    if(!days.has(dayKey(d.getTime()))) return 0;
  }
  let s = 0;
  while(days.has(dayKey(d.getTime()))){ s++; d.setDate(d.getDate()-1); }
  return s;
}

function updateProgress(){
  const done = Object.keys(records).length;
  const total = VIDEOS.length;
  const pct = total ? (done/total)*100 : 0;
  $("#s-done").textContent = done;
  $("#bar").style.width = pct.toFixed(1) + "%";
  $("#ptxt").textContent = `学习进度 ${done} / ${total}（${pct.toFixed(0)}%）`;
  $("#fabBadge").textContent = done;
}

/* ========== 分类 chips ========== */
function initChips(){
  const box = $("#chips");
  box.innerHTML = CATS.map(c => {
    const count = c === "全部" ? VIDEOS.length : VIDEOS.filter(v => v.c === c).length;
    return `<button class="chip${c===curCat?" active":""}" data-cat="${c}">${c}<small>${count}</small></button>`;
  }).join("");
  box.addEventListener("click", e => {
    const b = e.target.closest(".chip");
    if(!b) return;
    curCat = b.dataset.cat;
    focusIds = null;
    document.querySelectorAll(".path").forEach(p => p.classList.remove("active"));
    document.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c === b));
    render();
  });
}

/* ========== 学习路径 ========== */
function initPaths(){
  const box = $("#paths");
  box.innerHTML = PATHS.map((p,i) =>
    `<button class="path" data-i="${i}">
       <div class="p-name">${p.name}</div>
       <div class="p-desc">${p.desc}</div>
       <span class="p-count">${p.ids.length} 讲 · 点击聚焦</span>
     </button>`).join("");

  box.addEventListener("click", e => {
    const b = e.target.closest(".path");
    if(!b) return;
    const p = PATHS[+b.dataset.i];
    const same = focusIds && focusIds.join() === p.ids.join();
    document.querySelectorAll(".path").forEach(x => x.classList.remove("active"));
    if(same){
      focusIds = null;
    } else {
      focusIds = p.ids.slice();
      b.classList.add("active");
      curCat = "全部";
      $("#search").value = "";
      document.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c.dataset.cat === "全部"));
    }
    render();
    document.querySelector(".toolbar").scrollIntoView({ behavior:"smooth", block:"start" });
  });
}

/* ========== 渲染视频网格 ========== */
function render(){
  const q = $("#search").value.trim().toLowerCase();
  const sort = $("#sort").value;

  let list = VIDEOS.filter(v => {
    const okCat = curCat === "全部" || v.c === curCat;
    const okQ = !q || v.t.toLowerCase().includes(q) || v.c.includes(q);
    return okCat && okQ;
  });

  if(sort === "hot") list = list.slice().sort((a,b)=>b.n-a.n);
  else if(sort === "cold") list = list.slice().sort((a,b)=>a.n-b.n);
  else if(sort === "title") list = list.slice().sort((a,b)=>a.t.localeCompare(b.t,"zh"));
  else list = list.slice().sort((a,b)=>a.o-b.o);

  if(!list.length){
    grid.innerHTML = `<div class="empty"><b>🔍</b>没有找到匹配的内容，换个关键词试试</div>`;
    return;
  }

  grid.innerHTML = list.map(v => {
    const rec = records[v.v];
    const done = !!rec;
    const hasNote = rec && rec.note && rec.note.trim();
    const url = "https://www.youtube.com/watch?v=" + v.v;
    const dim = focusIds && !focusIds.includes(v.v);
    return `<article class="card${done?" done":""}${dim?" dim":""}" data-id="${v.v}">
      <a class="thumb" href="${url}" target="_blank" rel="noopener noreferrer" title="在 YouTube 打开">
        <img src="https://i.ytimg.com/vi/${v.v}/mqdefault.jpg" alt="" loading="lazy"
             onerror="this.style.display='none'">
        <span class="play">▶</span>
        <span class="views">${fmtViews(v.n)} 次观看</span>
      </a>
      <div class="body">
        <h3>${v.t}</h3>
        <div class="meta">
          <span class="tag">${v.c}</span>
          <div class="actions">
            <button class="note-btn${hasNote?" has-note":""}" data-act="note" title="${hasNote?"查看 / 编辑笔记":"写笔记（同时标记为已学）"}">✎</button>
            <button class="done-btn" data-act="toggle">${done?"✓ 已学":"标记已学"}</button>
          </div>
        </div>
      </div>
    </article>`;
  }).join("");
}

/* ========== 网格交互 ========== */
grid.addEventListener("click", e => {
  const noteBtn = e.target.closest('[data-act="note"]');
  if(noteBtn){
    e.preventDefault();
    openNote(noteBtn.closest(".card").dataset.id);
    return;
  }
  const btn = e.target.closest('[data-act="toggle"]');
  if(!btn) return;
  e.preventDefault();
  const card = btn.closest(".card");
  const id = card.dataset.id;

  if(records[id]){
    if(!confirm("取消标记会同时删除这条学习记录和笔记，确定吗？")) return;
    delete records[id];
  } else {
    records[id] = { at: Date.now(), note: "" };
  }
  saveRecords();

  const done = !!records[id];
  card.classList.toggle("done", done);
  btn.textContent = done ? "✓ 已学" : "标记已学";
  const nb = card.querySelector(".note-btn");
  const noteTxt = records[id] && records[id].note && records[id].note.trim();
  nb.classList.toggle("has-note", !!noteTxt);

  updateProgress();
  renderPanel();
});

$("#search").addEventListener("input", render);
$("#sort").addEventListener("change", render);

$("#rand").addEventListener("click", () => {
  const cards = [...document.querySelectorAll(".card")];
  if(!cards.length) return;
  const c = cards[Math.floor(Math.random()*cards.length)];
  c.scrollIntoView({ behavior:"smooth", block:"center" });
  c.style.transition = "none";
  c.style.boxShadow = "0 0 0 3px rgba(224,176,77,.9)";
  setTimeout(() => { c.style.transition = ""; c.style.boxShadow = ""; }, 900);
});

document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement !== $("#search") && !$("#noteModal").classList.contains("open")){
    e.preventDefault();
    $("#search").focus();
    $("#search").select();
  }
  if(e.key === "Escape"){
    if($("#noteModal").classList.contains("open")) closeNote();
    else if($("#panel").classList.contains("open")) closePanel();
    else if(document.activeElement === $("#search")){ $("#search").value = ""; render(); $("#search").blur(); }
  }
});

/* ========== 面板开关 ========== */
function openPanel(){
  renderPanel();
  $("#panel").classList.add("open");
  $("#overlay").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closePanel(){
  $("#panel").classList.remove("open");
  $("#overlay").classList.remove("open");
  document.body.style.overflow = "";
}
$("#fab").addEventListener("click", openPanel);
$("#panelClose").addEventListener("click", closePanel);
$("#overlay").addEventListener("click", closePanel);

/* ========== 渲染学习记录面板 ========== */
function renderPanel(){
  const ids = Object.keys(records);
  const todayK = dayKey(Date.now());
  const todayCount = ids.filter(id => dayKey(records[id].at) === todayK).length;
  const weekCount = ids.filter(id => Date.now() - records[id].at < 7*864e5).length;

  $("#rs-today").textContent = todayCount;
  $("#rs-week").textContent = weekCount;
  $("#rs-streak").textContent = calcStreak();
  $("#rs-total").textContent = ids.length;

  const body = $("#recBody");

  if(!ids.length){
    body.innerHTML = `<div class="rec-blank"><b>📭</b>还没有学习记录<br>点击任意视频卡片的「标记已学」<br>或点 ✎ 写下你的第一条笔记</div>`;
    return;
  }

  /* 按日期分组 */
  const groups = {};
  ids.forEach(id => {
    const k = dayKey(records[id].at);
    (groups[k] = groups[k] || []).push(id);
  });

  const keys = Object.keys(groups).sort((a,b) => b.localeCompare(a));

  body.innerHTML = keys.map(k => {
    const list = groups[k].sort((a,b) => records[b].at - records[a].at);
    return `<div class="rec-group">
      <div class="rec-date">${friendlyDate(k)}<span>${list.length} 条</span></div>
      ${list.map(id => {
        const v = V_MAP[id];
        const r = records[id];
        const title = v ? v.t : id;
        const url = "https://www.youtube.com/watch?v=" + id;
        return `<div class="rec-item">
          <h5>${title}</h5>
          ${r.note && r.note.trim() ? `<div class="rec-note">${escapeHTML(r.note.trim())}</div>` : ""}
          <div class="rec-foot">
            <span class="rec-time">🕐 ${timeStr(r.at)}</span>
            <a href="${url}" target="_blank" rel="noopener noreferrer">去复习 ↗</a>
          </div>
        </div>`;
      }).join("")}
    </div>`;
  }).join("");
}

function escapeHTML(s){
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ========== 笔记弹窗 ========== */
let noteEditing = null;

function openNote(id){
  noteEditing = id;
  const v = V_MAP[id];
  const r = records[id];
  $("#nmTitle").textContent = v ? v.t : id;
  $("#nmText").value = r && r.note ? r.note : "";
  $("#nmDelete").style.display = r ? "" : "none";
  $("#noteModal").classList.add("open");
  document.body.style.overflow = "hidden";
  setTimeout(() => $("#nmText").focus(), 140);
}
function closeNote(){
  $("#noteModal").classList.remove("open");
  noteEditing = null;
  if(!$("#panel").classList.contains("open")) document.body.style.overflow = "";
}
$("#nmCancel").addEventListener("click", closeNote);
$("#noteModal").addEventListener("click", e => { if(e.target === $("#noteModal")) closeNote(); });

$("#nmSave").addEventListener("click", () => {
  if(!noteEditing) return;
  const txt = $("#nmText").value.trim();
  if(!records[noteEditing]) records[noteEditing] = { at: Date.now(), note: "" };
  records[noteEditing].note = txt;
  saveRecords();
  closeNote();
  render();
  renderPanel();
  updateProgress();
});

$("#nmDelete").addEventListener("click", () => {
  if(!noteEditing) return;
  if(!confirm("确定删除这条学习记录和笔记吗？")) return;
  delete records[noteEditing];
  saveRecords();
  closeNote();
  render();
  renderPanel();
  updateProgress();
});

/* ========== 导出 / 导入 / 清空 ========== */
$("#btnExport").addEventListener("click", () => {
  if(!Object.keys(records).length){ alert("还没有学习记录可以导出"); return; }
  const data = { version: 2, exportedAt: new Date().toISOString(), app: "郭春林学习中心", records };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `郭春林学习记录_${dayKey(Date.now())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
});

$("#importFile").addEventListener("change", e => {
  const f = e.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = JSON.parse(rd.result);
      const r = (d && d.records) ? d.records : d;
      if(!r || typeof r !== "object" || Array.isArray(r)) throw new Error("bad");
      let added = 0;
      Object.keys(r).forEach(id => {
        if(!V_MAP[id]) return;                 // 跳过不认识的视频
        const item = r[id];
        if(!item || typeof item.at !== "number") return;
        records[id] = { at: item.at, note: String(item.note || "") };
        added++;
      });
      saveRecords();
      render(); renderPanel(); updateProgress();
      alert(`导入成功，共恢复 ${added} 条记录`);
    }catch(err){
      alert("文件格式不正确，请选择本页面导出的 JSON 备份文件");
    }
  };
  rd.readAsText(f);
  e.target.value = "";
});

$("#btnClear").addEventListener("click", () => {
  const n = Object.keys(records).length;
  if(!n){ alert("当前没有记录"); return; }
  if(!confirm(`确定清空全部 ${n} 条学习记录和笔记吗？此操作不可恢复。\n建议先「导出备份」。`)) return;
  records = {};
  saveRecords();
  render(); renderPanel(); updateProgress();
});

/* ========== 启动 ========== */
initStats();
initChips();
initPaths();
render();
renderPanel();
</script>
</body>
