<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>郭春林深度解 · 學習中心</title>
<style>
:root{  --bg: #090c1a;
  --panel: #111628;
  --panel2: #161c32;
  --panel3: #1c2440;
  --line: #252c45;
  --text: #e8ecf9;
  --muted: #8b95b8;
  --gold: #818cf8;
  --gold2: #a5b4fc;
  --accent: #22d3ee;
  --danger: #fb7185;
  --glow: 129,140,248;}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px;
  font-family:"PingFang TC","Microsoft JhengHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 520px at 12% -6%,rgba(var(--glow),.14),transparent 62%),
    radial-gradient(760px 520px at 92% 0%,rgba(var(--glow),.08),transparent 62%),
    radial-gradient(700px 600px at 50% 110%,rgba(var(--glow),.05),transparent 60%)}
.wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:0 20px}
.hero{padding:56px 0 34px;text-align:center}
.eyebrow{display:inline-block;font-size:12px;letter-spacing:.28em;color:var(--gold);
  border:1px solid rgba(var(--glow),.35);border-radius:999px;padding:6px 16px 6px 20px;
  margin-bottom:20px;background:rgba(var(--glow),.06)}
.hero h1{font-size:clamp(30px,5.4vw,52px);font-weight:800;letter-spacing:.04em;line-height:1.15;
  background:linear-gradient(120deg,var(--text) 10%,var(--gold2) 48%,var(--muted) 96%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{margin-top:14px;color:var(--muted);font-size:15px;letter-spacing:.06em}
.stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:32px}
.stat{min-width:118px;background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:14px;padding:14px 20px}
.stat b{display:block;font-size:24px;font-weight:800;color:var(--gold2);letter-spacing:.02em}
.stat span{display:block;font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.1em}
.progress{max-width:520px;margin:26px auto 0;height:7px;background:var(--panel2);
  border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress .bar{height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--gold),var(--accent));transition:width .5s cubic-bezier(.22,1,.36,1)}
.progress-txt{margin-top:10px;font-size:13px;color:var(--muted);letter-spacing:.06em}
.section-title{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:700;
  letter-spacing:.1em;color:var(--text);margin:34px 0 16px;opacity:.92}
.section-title::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,var(--line),transparent)}
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.path{text-align:left;cursor:pointer;background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:14px;padding:16px 18px;transition:.25s;color:var(--text);
  font-family:inherit}
.path:hover{transform:translateY(-3px);border-color:rgba(var(--glow),.45);box-shadow:0 12px 28px rgba(0,0,0,.45)}
.path.active{border-color:var(--gold);background:linear-gradient(160deg,rgba(var(--glow),.13),var(--panel))}
.path .p-name{font-size:15px;font-weight:700;letter-spacing:.04em}
.path .p-desc{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6}
.path .p-count{font-size:11px;color:var(--gold);letter-spacing:.14em;margin-top:10px;display:block}
.toolbar{position:sticky;top:0;z-index:30;background:rgba(0,0,0,.55);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 0;margin:38px 0 24px}
.toolbar-inner{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.search-box{position:relative;flex:1 1 260px;min-width:200px}
.search-box input{width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;color:var(--text);font-size:14px;padding:11px 14px 11px 38px;
  outline:none;transition:.2s;font-family:inherit}
.search-box input:focus{border-color:rgba(var(--glow),.6);box-shadow:0 0 0 3px rgba(var(--glow),.1)}
.search-box input::placeholder{color:var(--muted);opacity:.6}
.search-box .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:14px}
select{background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--text);
  padding:11px 12px;font-size:13px;outline:none;cursor:pointer;font-family:inherit}
select:focus{border-color:rgba(var(--glow),.6)}
.btn-rand{background:linear-gradient(135deg,rgba(var(--glow),.2),rgba(var(--glow),.06));
  border:1px solid rgba(var(--glow),.45);color:var(--gold2);border-radius:11px;
  padding:11px 16px;font-size:13px;cursor:pointer;transition:.2s;font-family:inherit;white-space:nowrap}
.btn-rand:hover{background:rgba(var(--glow),.28)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:transparent;border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;transition:.2s;font-family:inherit}
.chip:hover{border-color:rgba(var(--glow),.5);color:var(--gold2)}
.chip.active{background:rgba(var(--glow),.15);border-color:var(--gold);color:var(--gold2);font-weight:600}
.chip small{opacity:.6;margin-left:5px;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:18px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;display:flex;flex-direction:column;
  transition:transform .28s cubic-bezier(.22,1,.36,1),border-color .28s,box-shadow .28s,opacity .28s}
.card:hover{transform:translateY(-5px);border-color:rgba(var(--glow),.5);box-shadow:0 16px 36px rgba(0,0,0,.55)}
.card.dim{opacity:.18;filter:grayscale(.7)}
.card.done{border-color:rgba(74,222,128,.4)}
.card.done::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);z-index:2}
.card.inqueue::after{content:"📚";position:absolute;right:10px;top:10px;font-size:14px;
  z-index:3;background:rgba(0,0,0,.6);border-radius:6px;padding:2px 6px}
.thumb{position:relative;display:block;aspect-ratio:16/9;overflow:hidden;
  background:linear-gradient(135deg,var(--panel3),var(--panel))}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.22,1,.36,1)}
.card:hover .thumb img{transform:scale(1.06)}
.thumb::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.55));pointer-events:none}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:var(--gold);color:#141414;font-size:15px;padding-left:3px;
  opacity:0;transition:.28s;z-index:2}
.card:hover .play{opacity:1;transform:translate(-50%,-50%) scale(1)}
.views{position:absolute;right:9px;bottom:9px;z-index:2;font-size:11.5px;color:#e6ebf5;
  background:rgba(0,0,0,.66);border-radius:6px;padding:3px 8px;
  backdrop-filter:blur(4px);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.duration{position:absolute;left:9px;bottom:9px;z-index:2;font-size:11.5px;color:#e6ebf5;
  background:rgba(0,0,0,.66);border-radius:6px;padding:3px 8px;
  backdrop-filter:blur(4px);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.body{padding:14px 15px 15px;display:flex;flex-direction:column;gap:12px;flex:1}
.body h3{font-size:14.5px;font-weight:600;line-height:1.55;letter-spacing:.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:45px;color:var(--text)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;flex-wrap:wrap}
.tag{font-size:11px;color:var(--gold);letter-spacing:.06em;background:rgba(var(--glow),.1);
  border:1px solid rgba(var(--glow),.25);border-radius:6px;padding:3px 9px;white-space:nowrap}
.actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.note-btn{background:transparent;border:1px solid var(--line);color:var(--muted);
  border-radius:999px;width:28px;height:24px;font-size:12px;cursor:pointer;
  transition:.2s;font-family:inherit;display:grid;place-items:center;line-height:1}
.note-btn:hover{border-color:var(--gold);color:var(--gold2)}
.note-btn.has-note{background:rgba(var(--glow),.14);border-color:rgba(var(--glow),.55);color:var(--gold2)}
.queue-btn{background:transparent;border:1px solid var(--line);color:var(--muted);
  border-radius:999px;width:28px;height:24px;font-size:12px;cursor:pointer;
  transition:.2s;font-family:inherit;display:grid;place-items:center;line-height:1}
.queue-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.queue-btn.inqueue{background:rgba(var(--glow),.18);border-color:var(--gold);color:var(--gold2)}
.done-btn{background:transparent;border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:4px 11px;font-size:11.5px;cursor:pointer;transition:.2s;
  font-family:inherit;white-space:nowrap}
.done-btn:hover{border-color:var(--gold);color:var(--gold2)}
.card.done .done-btn{background:rgba(74,222,128,.13);border-color:rgba(74,222,128,.5);
  color:var(--accent);font-weight:600}
.empty{text-align:center;padding:70px 20px;color:var(--muted);font-size:14px;
  letter-spacing:.08em;grid-column:1/-1}
.empty b{display:block;font-size:34px;margin-bottom:12px;opacity:.4}
.fab{position:fixed;right:26px;bottom:26px;z-index:60;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#141414;border:none;border-radius:999px;padding:14px 22px;
  font-size:14px;font-weight:700;letter-spacing:.06em;cursor:pointer;
  box-shadow:0 10px 30px rgba(var(--glow),.28);transition:.25s;font-family:inherit;
  display:flex;align-items:center;gap:9px}
.fab:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(var(--glow),.42)}
.fab .badge{background:#141414;color:var(--gold2);font-size:11px;font-weight:800;
  border-radius:999px;padding:2px 8px;min-width:22px;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:.32s;z-index:70}
.overlay.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(500px,94vw);
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border-left:1px solid var(--line);z-index:80;transform:translateX(102%);
  transition:transform .42s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column}
.panel.open{transform:translateX(0)}
.panel-head{padding:20px 20px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel-head h2{font-size:16px;font-weight:700;letter-spacing:.1em;color:var(--gold2)}
.panel-head .close{background:transparent;border:1px solid var(--line);color:var(--muted);
  width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;
  display:grid;place-items:center;transition:.2s;font-family:inherit;line-height:1}
.panel-head .close:hover{border-color:var(--gold);color:var(--gold2)}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel)}
.tabs button{flex:1;padding:12px 8px;background:transparent;border:none;color:var(--muted);
  font-family:inherit;font-size:13px;cursor:pointer;transition:.2s;
  border-bottom:2px solid transparent}
.tabs button.active{color:var(--gold2);border-bottom-color:var(--gold);font-weight:600}
.tabs button:hover{color:var(--gold2)}
.rec-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  padding:16px 20px;border-bottom:1px solid var(--line)}
.rec-stat{text-align:center;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:10px 4px}
.rec-stat b{display:block;font-size:19px;font-weight:800;color:var(--gold2);
  font-variant-numeric:tabular-nums}
.rec-stat span{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;letter-spacing:.08em}
.rec-tools{display:flex;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rec-tools button, .rec-tools label{flex:1 1 auto;background:transparent;border:1px solid var(--line);
  color:var(--muted);border-radius:9px;padding:8px 12px;font-size:12px;cursor:pointer;
  transition:.2s;font-family:inherit;text-align:center;white-space:nowrap}
.rec-tools button:hover, .rec-tools label:hover{border-color:var(--gold);color:var(--gold2)}
.rec-tools .danger:hover{border-color:var(--danger);color:var(--danger)}
.rec-tools input[type=file]{display:none}
.rec-body{flex:1;overflow-y:auto;padding:18px 20px 40px}
.rec-body::-webkit-scrollbar{width:7px}
.rec-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.rec-group{margin-bottom:24px}
.rec-date{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;
  letter-spacing:.14em;color:var(--gold);margin-bottom:10px;padding-bottom:7px;
  border-bottom:1px dashed var(--line)}
.rec-date span{color:var(--muted);letter-spacing:.04em}
.rec-item{background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;margin-bottom:9px;transition:.2s}
.rec-item:hover{border-color:rgba(var(--glow),.4)}
.rec-item h5{font-size:13px;font-weight:600;line-height:1.55;margin-bottom:7px}
.rec-note{font-size:12px;color:var(--muted);line-height:1.7;white-space:pre-wrap;
  border-left:2px solid rgba(var(--glow),.45);padding-left:10px;margin:8px 0 4px}
.rec-note a{color:var(--gold2);text-decoration:none;border-bottom:1px dotted var(--gold2)}
.rec-note a:hover{color:var(--gold)}
.rec-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}
.rec-time{font-size:11px;color:var(--muted);opacity:.7;font-variant-numeric:tabular-nums}
.rec-foot a{font-size:11px;color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--line)}
.rec-foot a:hover{color:var(--gold)}
.rec-blank{text-align:center;color:var(--muted);font-size:13px;padding:60px 20px;line-height:2}
.rec-blank b{display:block;font-size:32px;opacity:.35;margin-bottom:10px}
.queue-item{background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;margin-bottom:9px;transition:.2s;display:flex;gap:10px;align-items:flex-start}
.queue-item:hover{border-color:rgba(var(--glow),.4)}
.queue-item .q-body{flex:1;min-width:0}
.queue-item h5{font-size:13px;font-weight:600;line-height:1.5;margin-bottom:6px}
.queue-item .q-meta{font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.queue-item .q-meta span{white-space:nowrap}
.queue-item .q-actions{display:flex;gap:4px;flex-direction:column}
.queue-item .q-actions button{background:transparent;border:1px solid var(--line);
  color:var(--muted);border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;
  font-family:inherit;transition:.2s;white-space:nowrap}
.queue-item .q-actions button:hover{border-color:var(--gold);color:var(--gold2)}
.q-status{display:inline-block;font-size:10px;padding:1px 7px;border-radius:4px;
  border:1px solid var(--line);margin-right:4px}
.q-status.todo{color:var(--muted);border-color:var(--muted)}
.q-status.doing{color:var(--gold2);border-color:var(--gold)}
.q-status.done{color:var(--accent);border-color:var(--accent)}
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;
  background:rgba(0,0,0,.7);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:.28s}
.modal.open{opacity:1;pointer-events:auto}
.modal-box{width:min(600px,100%);background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:16px;padding:22px;
  box-shadow:0 30px 80px rgba(0,0,0,.7);transform:translateY(14px) scale(.98);
  transition:.3s cubic-bezier(.22,1,.36,1)}
.modal.open .modal-box{transform:translateY(0) scale(1)}
.modal-box h4{font-size:14px;font-weight:600;line-height:1.6;color:var(--gold2);margin-bottom:14px}
.modal-box textarea{width:100%;min-height:180px;resize:vertical;background:var(--bg);
  border:1px solid var(--line);border-radius:11px;color:var(--text);font-size:13.5px;
  line-height:1.8;padding:13px 15px;outline:none;font-family:inherit;transition:.2s}
.modal-box textarea:focus{border-color:rgba(var(--glow),.6);box-shadow:0 0 0 3px rgba(var(--glow),.09)}
.modal-hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.7}
.modal-hint code{background:var(--panel);padding:1px 5px;border-radius:4px;color:var(--gold2);font-size:11px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.modal-actions button{border-radius:10px;padding:9px 20px;font-size:13px;cursor:pointer;
  transition:.2s;font-family:inherit;border:1px solid var(--line)}
.modal-actions .cancel{background:transparent;color:var(--muted)}
.modal-actions .cancel:hover{border-color:var(--muted);color:var(--text)}
.modal-actions .save{background:linear-gradient(135deg,var(--gold),var(--gold2));
  border-color:transparent;color:#141414;font-weight:700}
.modal-actions .del{background:transparent;color:var(--danger);
  border-color:rgba(248,113,113,.35);margin-right:auto}
.modal-actions .del:hover{background:rgba(248,113,113,.1)}
footer{margin-top:60px;text-align:center;color:var(--muted);font-size:12.5px;
  line-height:2;letter-spacing:.06em;opacity:.75}
@media(max-width:640px){
  .hero{padding:38px 0 24px}
  .stats{gap:10px}
  .stat{min-width:calc(50% - 10px);padding:12px 14px;flex:1}
  .stat b{font-size:20px}
  .grid{grid-template-columns:1fr;gap:14px}
  .toolbar{margin:26px 0 18px}
  .fab{right:16px;bottom:16px;padding:12px 18px;font-size:13px}
  .rec-stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <span class="eyebrow">郭春林深度解 · 普通人逆袭指南 · 哲学智慧入门</span>
    <h1>郭春林深度解 · 學習中心</h1>
    <p class="sub">精選 95 支影片，涵蓋 郭春林深度解、普通人逆袭指南、哲学智慧入门、生活哲学探讨 等主題</p>
    <div class="stats">
      <div class="stat"><b id="s-videos">0</b><span>精選影片</span></div>
      <div class="stat"><b id="s-views">0</b><span>累計觀看</span></div>
      <div class="stat"><b id="s-hours">0</b><span>總時長</span></div>
      <div class="stat"><b id="s-done">0</b><span>已學紀錄</span></div>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <p class="progress-txt" id="ptxt">學習進度 0 / 0</p>
  </div>
</header>
<main class="wrap">
  <div class="section-title">推薦學習路徑</div>
  <div class="paths" id="paths"></div>
  <div class="toolbar">
    <div class="toolbar-inner">
      <div class="search-box">
        <span class="ico">🔍</span>
        <input id="search" type="search" placeholder="搜尋主題（按 / 快速聚焦）">
      </div>
      <select id="sort">
        <option value="hot">觀看次數 ↓</option>
        <option value="cold">觀看次數 ↑</option>
        <option value="title">標題排序</option>
        <option value="orig">原始順序</option>
      </select>
      <button class="btn-rand" id="rand">🎲 隨機一堂</button>
      <button class="btn-rand" id="btnToday">📚 今日隊列</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="grid" id="grid"></div>
  <footer>資料來源：匯入檔案 · 共精選 95 筆<br>點擊封面跳轉 YouTube 原影片 · 學習紀錄與筆記儲存在本機瀏覽器</footer>
</main>
<button class="fab" id="fab">📖 學習紀錄 <span class="badge" id="fabBadge">0</span></button>

  $("#s-done").textContent = done;
  $("#bar").style.width = pct.toFixed(1) + "%";
  $("#ptxt").textContent = "學習進度 " + done + " / " + total + "（" + pct.toFixed(0) + "%）";
  $("#fabBadge").textContent = done;
}
function initChips() {
  const box = $("#chips");
  box.innerHTML = CATS.map(c => {
    const count = c === "全部" ? VIDEOS.length : VIDEOS.filter(v => v.c === c).length;
    return '<button class="chip' + (c === curCat ? " active" : "") +
           '" data-cat="' + escapeHTML(c) + '">' + escapeHTML(c) +
           '<small>' + count + '</small></button>';
  }).join("");
  box.addEventListener("click", e => {
    const b = e.target.closest(".chip");
    if (!b) return;
    curCat = b.dataset.cat; focusIds = null;
    document.querySelectorAll(".path").forEach(p => p.classList.remove("active"));
    document.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c === b));
    render();
  });
}
function initPaths() {
  const box = $("#paths");
  if (!PATHS.length) { box.parentElement.style.display = "none"; return; }
  box.innerHTML = PATHS.map((p, i) =>
    '<button class="path" data-i="' + i + '">' +
      '<div class="p-name">' + escapeHTML(p.name) + '</div>' +
      '<div class="p-desc">' + escapeHTML(p.desc) + '</div>' +
      '<span class="p-count">' + p.ids.length + ' 講 · 點擊聚焦</span>' +
    '</button>').join("");
  box.addEventListener("click", e => {
    const b = e.target.closest(".path");
    if (!b) return;
    const p = PATHS[+b.dataset.i];
    const same = focusIds && focusIds.join() === p.ids.join();
    document.querySelectorAll(".path").forEach(x => x.classList.remove("active"));
    if (same) { focusIds = null; }
    else {
      focusIds = p.ids.slice(); b.classList.add("active");
      curCat = "全部"; $("#search").value = "";
      document.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c.dataset.cat === "全部"));
    }
    render();
    document.querySelector(".toolbar").scrollIntoView({ behavior: "smooth", block: "start" });
  });
}
function render() {
  const q = $("#search").value.trim().toLowerCase();
  const sort = $("#sort").value;
  let list = VIDEOS.filter(v => {
    const okCat = curCat === "全部" || v.c === curCat;
    const okQ = !q || v.t.toLowerCase().includes(q) || v.c.includes(q);
    return okCat && okQ;
  });
  if (sort === "hot") list = list.slice().sort((a, b) => b.n - a.n);
  else if (sort === "cold") list = list.slice().sort((a, b) => a.n - b.n);
  else if (sort === "title") list = list.slice().sort((a, b) => a.t.localeCompare(b.t, "zh-Hant"));
  else list = list.slice().sort((a, b) => a.o - b.o);
  if (!list.length) {
    grid.innerHTML = '<div class="empty"><b>🔍</b>沒有找到符合的內容，換個關鍵字試試</div>';
    return;
  }
  grid.innerHTML = list.map(v => {
    const rec = records[v.v];
    const done = !!rec;
    const hasNote = rec && rec.note && rec.note.trim();
    const inQueue = !!queue[v.v];
    const url = "https://www.youtube.com/watch?v=" + v.v;
    const dim = focusIds && !focusIds.includes(v.v);
    const dur = v.d ? '<span class="duration">' + fmtDuration(v.d) + '</span>' : '';
    return '<article class="card' + (done ? " done" : "") + (dim ? " dim" : "") +
           (inQueue ? " inqueue" : "") + '" data-id="' + v.v + '">' +
      '<a class="thumb" href="' + url + '" target="_blank" rel="noopener noreferrer">' +
        '<img src="https://i.ytimg.com/vi/' + v.v + '/mqdefault.jpg" alt="" loading="lazy" ' +
             'onerror="this.style.display=\'none\'">' +
        '<span class="play">▶</span>' + dur +
        '<span class="views">' + fmtViews(v.n) + ' 次觀看</span>' +
      '</a>' +
      '<div class="body">' +
        '<h3>' + escapeHTML(v.t) + '</h3>' +
        '<div class="meta">' +
          '<span class="tag">' + escapeHTML(v.c) + '</span>' +
          '<div class="actions">' +
            '<button class="note-btn' + (hasNote ? " has-note" : "") +
              '" data-act="note" title="' + (hasNote ? "檢視 / 編輯筆記" : "寫筆記（同時標記已學）") + '">✎</button>' +
            '<button class="queue-btn' + (inQueue ? " inqueue" : "") +
              '" data-act="queue" title="' + (inQueue ? "從學習隊列移除" : "加入學習隊列") + '">📚</button>' +
            '<button class="done-btn" data-act="toggle">' + (done ? "✓ 已學" : "標記已學") + '</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</article>';
  }).join("");
}
grid.addEventListener("click", e => {
  const noteBtn = e.target.closest('[data-act="note"]');
  if (noteBtn) { e.preventDefault(); openNote(noteBtn.closest(".card").dataset.id); return; }
  const qBtn = e.target.closest('[data-act="queue"]');
  if (qBtn) {
    e.preventDefault();
    const card = qBtn.closest(".card");
    const id = card.dataset.id;
    if (queue[id]) { delete queue[id]; self && self._log && self._log(""); }
    else queue[id] = { added: Date.now(), status: "todo", next: "", count: 0, last: "" };
    saveQueue();
    card.classList.toggle("inqueue", !!queue[id]);
    qBtn.classList.toggle("inqueue", !!queue[id]);
    qBtn.title = queue[id] ? "從學習隊列移除" : "加入學習隊列";
    if (curTab === "queue") renderPanel();
    return;
  }
  const btn = e.target.closest('[data-act="toggle"]');
  if (!btn) return;
  e.preventDefault();
  const card = btn.closest(".card");
  const id = card.dataset.id;
  if (records[id]) {
    if (!confirm("取消標記會同時刪除這筆學習紀錄和筆記，確定嗎？")) return;
    delete records[id];
  } else records[id] = { at: Date.now(), note: "" };
  saveRecords();
  const done = !!records[id];
  card.classList.toggle("done", done);
  btn.textContent = done ? "✓ 已學" : "標記已學";
  const nb = card.querySelector(".note-btn");
  const noteTxt = records[id] && records[id].note && records[id].note.trim();
  nb.classList.toggle("has-note", !!noteTxt);
  updateProgress();
  renderPanel();
});
$("#search").addEventListener("input", render);
$("#sort").addEventListener("change", render);
$("#rand").addEventListener("click", () => {
  const cards = [...document.querySelectorAll(".card")];
  if (!cards.length) return;
  const c = cards[Math.floor(Math.random() * cards.length)];
  c.scrollIntoView({ behavior: "smooth", block: "center" });
  c.style.transition = "none";
  c.style.boxShadow = "0 0 0 3px rgba(224,176,77,.9)";
  setTimeout(() => { c.style.transition = ""; c.style.boxShadow = ""; }, 900);
});
$("#btnToday").addEventListener("click", () => { openPanel(); switchTab("queue"); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#search") &&
      !$("#noteModal").classList.contains("open")) {
    e.preventDefault(); $("#search").focus(); $("#search").select();
  }
  if (e.key === "Escape") {
    if ($("#noteModal").classList.contains("open")) closeNote();
    else if ($("#panel").classList.contains("open")) closePanel();
    else if (document.activeElement === $("#search")) { $("#search").value = ""; render(); $("#search").blur(); }
  }
});
function openPanel() {
  renderPanel();
  $("#panel").classList.add("open"); $("#overlay").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closePanel() {
  $("#panel").classList.remove("open"); $("#overlay").classList.remove("open");
  document.body.style.overflow = "";
}
$("#fab").addEventListener("click", openPanel);
$("#panelClose").addEventListener("click", closePanel);
$("#overlay").addEventListener("click", closePanel);
function switchTab(tab) {
  curTab = tab;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  $("#panelTitle").textContent = tab === "records" ? "📖 學習紀錄" : "📚 學習隊列";
  $("#statsBox").style.display = tab === "records" ? "" : "none";
  $("#toolsBox").style.display = tab === "records" ? "" : "none";
  renderPanel();
}
document.querySelectorAll(".tabs button").forEach(b => {
  b.addEventListener("click", () => switchTab(b.dataset.tab));
});
function renderPanel() {
  if (curTab === "queue") return renderQueue();
  const ids = Object.keys(records);
  const todayK = dayKey(Date.now());
  const todayCount = ids.filter(id => dayKey(records[id].at) === todayK).length;
  const weekCount = ids.filter(id => Date.now() - records[id].at < 7 * 864e5).length;
  $("#rs-today").textContent = todayCount;
  $("#rs-week").textContent = weekCount;
  $("#rs-streak").textContent = calcStreak();
  $("#rs-total").textContent = ids.length;
  const body = $("#recBody");
  if (!ids.length) {
    body.innerHTML = '<div class="rec-blank"><b>📭</b>還沒有學習紀錄<br>點擊任意影片卡片的「標記已學」<br>或點 ✎ 寫下你的第一則筆記</div>';
    return;
  }
  const groups = {};
  ids.forEach(id => { const k = dayKey(records[id].at); (groups[k] = groups[k] || []).push(id); });
  const keys = Object.keys(groups).sort((a, b) => b.localeCompare(a));
  body.innerHTML = keys.map(k => {
    const list = groups[k].sort((a, b) => records[b].at - records[a].at);
    return '<div class="rec-group">' +
      '<div class="rec-date">' + friendlyDate(k) + '<span>' + list.length + ' 筆</span></div>' +
      list.map(id => {
        const v = V_MAP[id]; const r = records[id];
        const title = v ? v.t : id;
        const url = "https://www.youtube.com/watch?v=" + id;
        return '<div class="rec-item">' +
          '<h5>' + escapeHTML(title) + '</h5>' +
          (r.note && r.note.trim() ? '<div class="rec-note">' + noteWithLinks(r.note.trim(), id) + '</div>' : '') +
          '<div class="rec-foot">' +
            '<span class="rec-time">🕐 ' + timeStr(r.at) + '</span>' +
            '<a href="' + url + '" target="_blank" rel="noopener">去複習 ↗</a>' +
          '</div>' +
        '</div>';
      }).join("") +
    '</div>';
  }).join("");
}
function renderQueue() {
  const ids = Object.keys(queue);
  const body = $("#recBody");
  if (!ids.length) {
    body.innerHTML = '<div class="rec-blank"><b>📚</b>學習隊列是空的<br>點擊影片卡片上的 📚 加入隊列</div>';
    return;
  }
  // 排序：今日複習優先
  const today = new Date().toISOString().slice(0,10);
  ids.sort((a, b) => {
    const qa = queue[a], qb = queue[b];
    const aToday = (qa.next && qa.next.slice(0,10) <= today) ? 0 : (qa.status === "todo" ? 1 : 2);
    const bToday = (qb.next && qb.next.slice(0,10) <= today) ? 0 : (qb.status === "todo" ? 1 : 2);
    if (aToday !== bToday) return aToday - bToday;
    return (qb.added || 0) - (qa.added || 0);
  });
  const statusText = { todo: "待學", doing: "複習中", done: "已精熟" };
  body.innerHTML = ids.map(id => {
    const v = V_MAP[id]; const q = queue[id];
    const title = v ? v.t : id;
    const url = "https://www.youtube.com/watch?v=" + id;
    let due = "";
    if (q.next) {
      const days = Math.ceil((new Date(q.next) - Date.now()) / 864e5);
      if (days <= 0) due = '<span style="color:var(--gold2)">📌 今日複習</span>';
      else due = '<span>⏰ ' + days + ' 天後複習</span>';
    }
    return '<div class="queue-item">' +
      '<div class="q-body">' +
        '<h5>' + escapeHTML(title) + '</h5>' +
        '<div class="q-meta">' +
          '<span class="q-status ' + q.status + '">' + statusText[q.status] + '</span>' +
          (q.count ? '<span>已複習 ' + q.count + ' 次</span>' : '') +
          due +
        '</div>' +
      '</div>' +
      '<div class="q-actions">' +
        '<button data-qact="open" data-qid="' + id + '">▶ 開啟</button>' +
        '<button data-qact="review" data-qid="' + id + '">✓ 複習</button>' +
        '<button data-qact="remove" data-qid="' + id + '">✕ 移除</button>' +
      '</div>' +
    '</div>';
  }).join("");
  body.querySelectorAll('[data-qact]').forEach(b => {
    b.addEventListener("click", e => {
      e.preventDefault();
      const act = b.dataset.qact; const id = b.dataset.qid;
      if (act === "open") window.open("https://www.youtube.com/watch?v=" + id, "_blank");
      else if (act === "review") {
        const q = queue[id]; if (!q) return;
        q.count = (q.count || 0) + 1;
        const intervals = [1, 3, 7, 14, 30, 60];
        const idx = Math.min(q.count - 1, intervals.length - 1);
        const d = new Date(); d.setDate(d.getDate() + intervals[idx]);
        q.next = d.toISOString().slice(0, 10);
        q.last = new Date().toISOString().slice(0, 10);
        q.status = q.count >= intervals.length ? "done" : "doing";
        if (!records[id]) records[id] = { at: Date.now(), note: "" };
        saveRecords(); saveQueue();
        updateProgress(); renderQueue();
      } else if (act === "remove") {
        if (!confirm("從學習隊列移除？")) return;
        delete queue[id]; saveQueue(); renderQueue();
        const card = document.querySelector('.card[data-id="' + id + '"]');
        if (card) { card.classList.remove("inqueue");
          const qb = card.querySelector(".queue-btn"); if (qb) qb.classList.remove("inqueue"); }
      }
    });
  });
}
let noteEditing = null;
function openNote(id) {
  noteEditing = id;
  const v = V_MAP[id]; const r = records[id];
  $("#nmTitle").textContent = v ? v.t : id;
  $("#nmText").value = r && r.note ? r.note : "";
  $("#nmDelete").style.display = r ? "" : "none";
  $("#noteModal").classList.add("open"); document.body.style.overflow = "hidden";
  setTimeout(() => $("#nmText").focus(), 140);
}
function closeNote() {
  $("#noteModal").classList.remove("open"); noteEditing = null;
  if (!$("#panel").classList.contains("open")) document.body.style.overflow = "";
}
$("#nmCancel").addEventListener("click", closeNote);
$("#noteModal").addEventListener("click", e => { if (e.target === $("#noteModal")) closeNote(); });
$("#nmSave").addEventListener("click", () => {
  if (!noteEditing) return;
  const txt = $("#nmText").value.trim();
  if (!records[noteEditing]) records[noteEditing] = { at: Date.now(), note: "" };
  records[noteEditing].note = txt;
  saveRecords(); closeNote(); render(); renderPanel(); updateProgress();
});
$("#nmDelete").addEventListener("click", () => {
  if (!noteEditing) return;
  if (!confirm("確定刪除這筆學習紀錄和筆記嗎？")) return;
  delete records[noteEditing]; saveRecords(); closeNote(); render(); renderPanel(); updateProgress();
});
$("#btnExport").addEventListener("click", () => {
  const data = { version: 3, exportedAt: new Date().toISOString(),
                 records: records, queue: queue };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "學習紀錄_" + dayKey(Date.now()) + ".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
});
$("#btnExportCsv").addEventListener("click", () => {
  if (!Object.keys(records).length && !Object.keys(queue).length) {
    alert("還沒有紀錄可以匯出"); return;
  }
  const rows = [["類型","影片ID","標題","分類","學習時間","筆記","隊列狀態","複習次數","下次複習"]];
  Object.keys(records).forEach(id => {
    const v = V_MAP[id]; const r = records[id];
    rows.push(["紀錄", id, v?v.t:id, v?v.c:"", new Date(r.at).toISOString().slice(0,19).replace("T"," "),
               (r.note||"").replace(/\n/g," / "), "", "", ""]);
  });
  Object.keys(queue).forEach(id => {
    if (records[id]) return; // 已包含
    const v = V_MAP[id]; const q = queue[id];
    rows.push(["隊列", id, v?v.t:id, v?v.c:"", "", "", q.status||"todo",
               q.count||0, q.next||""]);
  });
  const csv = "\ufeff" + rows.map(r =>
    r.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(",")).join("\r\n");
  const blob = new Blob([csv], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "學習紀錄_" + dayKey(Date.now()) + ".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
});
$("#importFile").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      const r = (d && d.records) ? d.records : d;
      const q = (d && d.queue) ? d.queue : {};
      if (!r || typeof r !== "object" || Array.isArray(r)) throw new Error("bad");
      let added = 0;
      Object.keys(r).forEach(id => {
        if (!V_MAP[id]) return;
        const item = r[id];
        if (!item || typeof item.at !== "number") return;
        records[id] = { at: item.at, note: String(item.note || "") };
        added++;
      });
      Object.keys(q).forEach(id => {
        if (!V_MAP[id]) return;
        queue[id] = q[id];
      });
      saveRecords(); saveQueue();
      render(); renderPanel(); updateProgress();
      alert("匯入成功，共還原 " + added + " 筆紀錄");
    } catch (err) { alert("檔案格式不正確"); }
  };
  rd.readAsText(f); e.target.value = "";
});
$("#btnClear").addEventListener("click", () => {
  const n = Object.keys(records).length;
  if (!n) { alert("目前沒有紀錄"); return; }
  if (!confirm("確定清空全部 " + n + " 筆學習紀錄和筆記嗎？\n建議先「匯出備份」。")) return;
  records = {}; saveRecords(); render(); renderPanel(); updateProgress();
});
initStats(); initChips(); initPaths(); render(); renderPanel();
</script>
</body>
