<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>詩魂【高手練功坊】形態學｜學習中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; color: #fff; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px 20px; background: rgba(255,255,255,0.05); border-radius: 20px; margin-bottom: 30px; }
        h1 { font-size: 2em; margin-bottom: 10px; color: #feca57; }
        .subtitle { font-size: 1em; color: #aaa; margin-bottom: 15px; }
        .stats { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-top: 15px; }
        .stat-item { text-align: center; }
        .stat-number { font-size: 1.5em; font-weight: bold; color: #feca57; }
        .stat-label { font-size: 0.8em; color: #888; }
        .progress-section { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 15px; margin-bottom: 30px; }
        .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.9em; }
        .progress-bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: #feca57; border-radius: 4px; transition: width 0.3s ease; }
        
        .video-item { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 15px; margin-bottom: 12px; cursor: pointer; border: 2px solid transparent; transition: all 0.3s ease; }
        .video-item:hover { background: rgba(255,255,255,0.12); }
        .video-item.completed { border-color: #feca57; background: rgba(254,202,87,0.1); }
        
        .video-header { display: flex; align-items: center; gap: 12px; }
        .video-number { width: 32px; height: 32px; background: rgba(255,255,255,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        .video-item.completed .video-number { background: #feca57; color: #1a1a2e; }
        .video-title { flex: 1; font-size: 0.95em; }
        .video-actions { display: flex; gap: 8px; align-items: center; }
        .video-link { color: #feca57; text-decoration: none; padding: 6px 12px; background: rgba(254,202,87,0.2); border-radius: 15px; font-size: 0.8em; }
        .notes-btn { background: rgba(255,200,0,0.2); border: 1px solid #ffc800; color: #ffc800; padding: 6px 12px; border-radius: 15px; cursor: pointer; font-size: 0.8em; }
        .check-btn { width: 26px; height: 26px; border: 2px solid #555; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .video-item.completed .check-btn { background: #feca57; border-color: #feca57; }
        .video-item.completed .check-btn::after { content: "✓"; color: #1a1a2e; font-weight: bold; font-size: 0.8em; }
        
        .notes-panel { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); }
        .notes-panel.show { display: block; }
        .notes-panel textarea { width: 100%; height: 100px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 10px; color: #fff; font-size: 0.9em; resize: vertical; font-family: inherit; }
        .notes-panel .save-btn { background: #feca57; border: none; padding: 8px 16px; border-radius: 8px; color: #1a1a2e; font-weight: bold; cursor: pointer; margin-top: 8px; }
        
        footer { text-align: center; padding: 20px; color: #666; font-size: 0.9em; }
        .reset-btn { background: rgba(255,100,100,0.2); border: 1px solid #ff6464; color: #ff6464; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 0.9em; }
        .export-btn { background: rgba(0,150,255,0.2); border: 1px solid #0096ff; color: #0096ff; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 0.9em; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 詩魂【高手練功坊】形態學</h1>
            <p class="subtitle">9部影片</p>
            <div class="stats">
                <div class="stat-item"><div class="stat-number" id="totalVideos">9</div><div class="stat-label">總影片數</div></div>
                <div class="stat-item"><div class="stat-number" id="completedCount">0</div><div class="stat-label">已完成</div></div>
                <div class="stat-item"><div class="stat-number" id="progressPercent">0%</div><div class="stat-label">學習進度</div></div>
                <div class="stat-item"><div class="stat-number" id="notesCount">0</div><div class="stat-label">筆記數</div></div>
            </div>
        </header>
        <div class="progress-section">
            <div class="progress-header"><span>學習進度</span><span id="progressText">0 / 9</span></div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
        </div>
        <div id="videoList"></div>
        <footer>
            <p>點擊圓圈標記完成 | 點擊筆記按鈕寫筆記</p>
            <button class="reset-btn" onclick="resetProgress()">重置進度</button>
            <button class="export-btn" onclick="exportNotes()">📤 匯出筆記</button>
        </footer>
    </div>
    <script>
    const videos = [
        {"id": "ABRGc0jxo9w", "title": "【贈送指標】【重磅教學】 買進賣出只看顏色 形態學指定專用 | 藍色買 紫色賣 3步驟收割大行情 | MACD+RSI+布林"},
        {"id": "JTsIojFDU64", "title": "【形態學】買在起漲點:破解所有延續形態，只需兩條線搞定 | 中段整理形態的標準買點與領先買點"},
        {"id": "Nid-X6gqKLo", "title": "【形態學】【重磅教學】 一招看破 反轉形態還是延續 |  VCP領先佈局的秘技 | 5分鐘學會 中段整理形態3大買點"},
        {"id": "_cFXgmHkl0M", "title": "【價格行為】要賺大錢，一定要學會的技術 | 勝率84% | W底 M頭 | 雙重底 雙重頂 N字結構"},
        {"id": "nyRyHVIPxmw", "title": "【炒股上億的秘密】太神了！機構買的股他全偷跟到，靠這指標 把1萬滾出$42,000,000"},
        {"id": "g4pAdekc6cE", "title": "【上班族必看】【18000%】股票： 33萬 ⮕ 6000萬，炒幣30萬⮕1.5億！"},
        {"id": "hfalSn4oR-g", "title": "【價格行為】【QML】勝率最高的型態 專門破解各種型態學 | ICT技術"},
        {"id": "fHoDBXA0UFg", "title": "華爾街12年連勝無一敗績的最強逃頂 抄底策略 一學就會"},
        {"id": "OzV_l3Q4Fh8", "title": "【超簡單】買在波段發動點！電腦自動抓買點，讓你領先市場"}
    ];
    
    const STORAGE_KEY = 'gcl-xingtai-notes';
    let completed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let notes = JSON.parse(localStorage.getItem(STORAGE_KEY + '-notes') || '{}');

    function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(completed));
        localStorage.setItem(STORAGE_KEY + '-notes', JSON.stringify(notes));
        updateStats();
    }

    function toggleNotes(idx) {
        const panel = document.getElementById('notes-' + idx);
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function saveNote(idx) {
        const note = document.getElementById('note-' + idx).value;
        notes[videos[idx].id] = note;
        localStorage.setItem(STORAGE_KEY + '-notes', JSON.stringify(notes));
        alert('筆記已儲存！');
    }

    function updateNotesCount() {
        const count = Object.keys(notes).filter(k => notes[k] && notes[k].trim()).length;
        document.getElementById('notesCount').textContent = count;
    }

    function exportNotes() {
        let text = '# 詩魂形態學 筆記\n\n';
        videos.forEach((v, i) => {
            const note = notes[v.id] || '';
            if (note.trim()) {
                text += '## ' + (i+1) + '. ' + v.title + '\n' + note + '\n\n';
            }
        });
        if (text === '# 詩魂形態學 筆記\n\n') {
            alert('目前沒有筆記');
            return;
        }
        const blob = new Blob([text], { type: 'text/markdown' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'xingtai-notes.md';
        a.click();
    }

    function toggleComplete(idx) {
        const id = videos[idx].id;
        if (completed.includes(id)) {
            completed = completed.filter(x => x !== id);
        } else {
            completed.push(id);
        }
        save();
        render();
    }

    function updateStats() {
        document.getElementById('completedCount').textContent = completed.length;
        document.getElementById('progressText').textContent = completed.length + ' / ' + videos.length;
        const p = Math.round(completed.length / videos.length * 100);
        document.getElementById('progressPercent').textContent = p + '%';
        document.getElementById('progressFill').style.width = p + '%';
        updateNotesCount();
    }

    function render() {
        const list = document.getElementById('videoList');
        list.innerHTML = videos.map((v, i) => {
            const isDone = completed.includes(v.id);
            const noteVal = notes[v.id] || '';
            return '<div class="video-item ' + (isDone ? 'completed' : '') + '" onclick="toggleComplete(' + i + ')">' +
                '<div class="video-header">' +
                    '<div class="video-number">' + (i+1) + '</div>' +
                    '<div class="video-title">' + v.title + '</div>' +
                    '<div class="video-actions">' +
                        '<a href="https://youtu.be/' + v.id + '" target="_blank" class="video-link" onclick="event.stopPropagation()">▶</a>' +
                        '<button class="notes-btn" onclick="event.stopPropagation();toggleNotes(' + i + ')">📝</button>' +
                        '<div class="check-btn"></div>' +
                    '</div>' +
                '</div>' +
                '<div class="notes-panel" id="notes-' + i + '">' +
                    '<textarea id="note-' + i + '" placeholder="在這裡記錄筆記...">' + noteVal + '</textarea>' +
                    '<button class="save-btn" onclick="saveNote(' + i + ')">💾 儲存筆記</button>' +
                '</div>' +
            '</div>';
        }).join('');
        updateStats();
    }

    function resetProgress() {
        if(confirm('確定重置？這也會刪除所有筆記')) {
            completed = [];
            notes = {};
            save();
            render();
        }
    }

    render();
    </script>
</body>
</html>
