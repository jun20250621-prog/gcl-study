<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT 學習網頁生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 2em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(255,255,255,0.08);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 1.2em;
            margin-bottom: 15px;
            color: #00d9ff;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
        }
        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1em;
            margin-bottom: 15px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #00d9ff;
        }
        textarea {
            min-height: 200px;
            font-family: monospace;
        }
        .btn {
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            color: #1a1a2e;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.02);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
            margin-top: 10px;
        }
        .result {
            margin-top: 20px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result textarea {
            min-height: 300px;
            font-size: 0.85em;
        }
        .help {
            background: rgba(255,200,0,0.1);
            border: 1px solid rgba(255,200,0,0.3);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .help h3 {
            color: #ffd700;
            font-size: 1em;
            margin-bottom: 10px;
        }
        .help code {
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .color-picker {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.2s;
        }
        .color-option:hover {
            transform: scale(1.1);
        }
        .color-option.selected {
            border-color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 YT 學習網頁生成器</h1>
        <p class="subtitle">輕鬆建立 YouTube 課程學習網頁</p>

        <div class="help">
            <h3>📋 使用說明</h3>
            <ol style="margin-left: 20px; color: #ccc; line-height: 1.8;">
                <li>輸入影片標題（每行一部，格式：<code>影片ID|標題|章節</code>）</li>
                <li>例如：<code>IxZpkk2xO8I|時代恐懼|第一章</code></li>
                <li>選擇顏色主題</li>
                <li>點擊生成並複製 HTML 代碼</li>
                <li>存為 .html 檔案即可使用</li>
            </ol>
        </div>

        <div class="card">
            <h2>📝 課程資訊</h2>
            <label>課程名稱</label>
            <input type="text" id="courseName" placeholder="例如：喚醒心力·重構心智">

            <label>課程副標題（可選）</label>
            <input type="text" id="courseSubtitle" placeholder="例如：郭春林 | 25堂必修課">

            <label>主題顏色</label>
            <div class="color-picker" id="colorPicker">
                <div class="color-option selected" style="background: linear-gradient(135deg, #00d9ff, #00ff88)" data-color="00d9ff,00ff88"></div>
                <div class="color-option" style="background: linear-gradient(135deg, #ff6b6b, #feca57)" data-color="ff6b6b,feca57"></div>
                <div class="color-option" style="background: linear-gradient(135deg, #a29bfe, #fd79a8)" data-color="a29bfe,fd79a8"></div>
                <div class="color-option" style="background: linear-gradient(135deg, #00b894, #00cec9)" data-color="00b894,00cec9"></div>
                <div class="color-option" style="background: linear-gradient(135deg, #e17055, #fdcb6e)" data-color="e17055,fdcb6e"></div>
                <div class="color-option" style="background: linear-gradient(135deg, #6c5ce7, #a29bfe)" data-color="6c5ce7,a29bfe"></div>
                <div class="color-option" style="background: linear-gradient(135deg, #e84393, #fd79a8)" data-color="e84393,fd79a8"></div>
                <div class="color-option" style="background: linear-gradient(135deg, #00cec9, #81ecec)" data-color="00cec9,81ecec"></div>
            </div>
        </div>

        <div class="card">
            <h2>🎥 影片列表</h2>
            <label>每行一部，格式：<code>影片ID|標題|章節（可選）</code></label>
            <textarea id="videoList" placeholder="IxZpkk2xO8I|時代恐懼：我們為何焦慮？|001.第一章
qC9GOGUhYy4|戰勝無力感|001.第一章
6NQLb2XNwEE|時代洪流生存指南|001.第一章"></textarea>
            <button class="btn" onclick="generateHTML()">生成 HTML</button>
        </div>

        <div class="card result" id="resultCard">
            <h2>📄 生成的 HTML</h2>
            <textarea id="outputHTML" readonly></textarea>
            <button class="btn btn-secondary" onclick="copyHTML()">複製 HTML</button>
            <button class="btn btn-secondary" onclick="downloadHTML()">下載 HTML 檔案</button>
        </div>
    </div>

    <script>
        let selectedColor = '00d9ff,00ff88';

        // 顏色選擇
        document.querySelectorAll('.color-option').forEach(opt => {
            opt.addEventListener('click', () => {
                document.querySelectorAll('.color-option').forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                selectedColor = opt.dataset.color;
            });
        });

        function generateHTML() {
            const courseName = document.getElementById('courseName').value || '課程學習';
            const courseSubtitle = document.getElementById('courseSubtitle').value || '';
            const videoText = document.getElementById('videoList').value.trim();

            if (!videoText) {
                alert('請輸入影片列表');
                return;
            }

            // 解析影片列表
            const videos = [];
            const lines = videoText.split('\n');
            lines.forEach(line => {
                line = line.trim();
                if (!line) return;

                const parts = line.split('|');
                const id = parts[0].trim();
                const title = parts[1] ? parts[1].trim() : `影片 ${videos.length + 1}`;
                const chapter = parts[2] ? parts[2].trim() : '';

                if (id) {
                    videos.push({ id, title, chapter });
                }
            });

            if (videos.length === 0) {
                alert('無法解析影片列表，請檢查格式');
                return;
            }

            const [c1, c2] = selectedColor.split(',');
            const slug = courseName.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase().substring(0, 20);

            const html = `<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${courseName}｜學習中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; color: #fff; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 40px 20px; background: rgba(255,255,255,0.05); border-radius: 20px; margin-bottom: 30px; backdrop-filter: blur(10px); }
        h1 { font-size: 2.2em; margin-bottom: 10px; background: linear-gradient(90deg, #${c1}, #${c2}); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { font-size: 1.1em; color: #aaa; margin-bottom: 20px; }
        .stats { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; margin-top: 20px; }
        .stat-item { text-align: center; }
        .stat-number { font-size: 2em; font-weight: bold; color: #${c1}; }
        .stat-label { font-size: 0.9em; color: #888; }
        .progress-section { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 20px; margin-bottom: 30px; }
        .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .progress-bar { height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #${c1}, #${c2}); border-radius: 5px; transition: width 0.3s ease; }
        .video-list { display: grid; gap: 15px; }
        .video-item { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 15px 20px; display: flex; align-items: center; gap: 15px; transition: all 0.3s ease; cursor: pointer; border: 2px solid transparent; }
        .video-item:hover { background: rgba(255,255,255,0.12); transform: translateX(5px); }
        .video-item.completed { border-color: #${c2}; background: rgba(255,255,255,0.1); }
        .video-item.completed .video-number { background: #${c2}; color: #1a1a2e; }
        .video-number { width: 35px; height: 35px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        .video-info { flex: 1; }
        .video-title { font-size: 1em; margin-bottom: 5px; color: #fff; }
        .video-chapter { font-size: 0.8em; color: #888; }
        .video-link { color: #${c1}; text-decoration: none; padding: 8px 15px; background: rgba(255,255,255,0.1); border-radius: 20px; font-size: 0.85em; transition: all 0.3s ease; white-space: nowrap; }
        .video-link:hover { background: rgba(255,255,255,0.2); }
        .check-btn { width: 28px; height: 28px; border: 2px solid #555; border-radius: 50%; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .check-btn:hover { border-color: #${c2}; }
        .video-item.completed .check-btn { background: #${c2}; border-color: #${c2}; }
        .check-btn::after { content: "✓"; color: #1a1a2e; font-weight: bold; display: none; }
        .video-item.completed .check-btn::after { display: block; }
        footer { text-align: center; padding: 30px; color: #666; font-size: 0.9em; }
        .reset-btn { background: rgba(255,100,100,0.2); border: 1px solid #ff6464; color: #ff6464; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 0.9em; margin-top: 20px; }
        @media (max-width: 600px) { h1 { font-size: 1.6em; } .stats { gap: 20px; } .video-item { flex-wrap: wrap; } .video-link { margin-top: 10px; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>${courseName}</h1>
            <p class="subtitle">${courseSubtitle}</p>
            <div class="stats">
                <div class="stat-item"><div class="stat-number" id="totalVideos">${videos.length}</div><div class="stat-label">總影片數</div></div>
                <div class="stat-item"><div class="stat-number" id="completedCount">0</div><div class="stat-label">已完成</div></div>
                <div class="stat-item"><div class="stat-number" id="progressPercent">0%</div><div class="stat-label">學習進度</div></div>
            </div>
        </header>
        <div class="progress-section">
            <div class="progress-header"><span>學習進度</span><span id="progressText">0 / ${videos.length}</span></div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
        </div>
        <div class="video-list" id="videoList"></div>
        <footer>
            <p>點擊圓圈可標記已完成</p>
            <button class="reset-btn" onclick="resetProgress()">重置進度</button>
        </footer>
    </div>
    <script>
        const videos = ${JSON.stringify(videos)};
        const STORAGE_KEY = 'gcl-${slug}-completed';
        let completedVideos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        
        function saveProgress() { localStorage.setItem(STORAGE_KEY, JSON.stringify(completedVideos)); updateStats(); }
        function toggleComplete(index) { const id = videos[index].id; completedVideos.includes(id) ? completedVideos = completedVideos.filter(x => x !== id) : completedVideos.push(id); saveProgress(); renderList(); }
        function updateStats() { document.getElementById('completedCount').textContent = completedVideos.length; document.getElementById('progressText').textContent = completedVideos.length + ' / ' + videos.length; const p = Math.round(completedVideos.length / videos.length * 100); document.getElementById('progressPercent').textContent = p + '%'; document.getElementById('progressFill').style.width = p + '%'; }
        function renderList() { document.getElementById('videoList').innerHTML = videos.map((v, i) => '<div class="video-item ' + (completedVideos.includes(v.id) ? 'completed' : '') + '" onclick="toggleComplete(' + i + ')"><div class="video-number">' + (i+1) + '</div><div class="video-info"><div class="video-title">' + v.title + '</div><div class="video-chapter">' + v.chapter + '</div></div><a href="https://youtu.be/' + v.id + '" target="_blank" class="video-link" onclick="event.stopPropagation()">▶ 看影片</a><div class="check-btn"></div></div>').join(''); updateStats(); }
        function resetProgress() { if(confirm('確定重置？')) { completedVideos = []; saveProgress(); renderList(); } }
        renderList();
    <\/script>
</body>
</html>`;

            document.getElementById('outputHTML').value = html;
            document.getElementById('resultCard').classList.add('show');
        }

        function copyHTML() {
            const textarea = document.getElementById('outputHTML');
            textarea.select();
            document.execCommand('copy');
            alert('已複製到剪貼簿！');
        }

        function downloadHTML() {
            const html = document.getElementById('outputHTML').value;
            const courseName = document.getElementById('courseName').value || 'study';
            const filename = courseName.replace(/[^a-zA-Z0-9]/g, '-') + '.html';

            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
