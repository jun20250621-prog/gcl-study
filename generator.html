<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT 學習網頁生成器（支援筆記）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            text-align: center;
            font-size: 2em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; }
        .card {
            background: rgba(255,255,255,0.08);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .card h2 { font-size: 1.2em; margin-bottom: 15px; color: #00d9ff; }
        label { display: block; margin-bottom: 8px; color: #aaa; }
        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1em;
            margin-bottom: 15px;
        }
        input:focus, textarea:focus { outline: none; border-color: #00d9ff; }
        textarea { min-height: 200px; font-family: monospace; }
        .btn {
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            color: #1a1a2e;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
            margin-bottom: 10px;
        }
        .btn:hover { transform: scale(1.02); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-row { display: flex; gap: 10px; }
        .btn-row .btn { flex: 1; margin-bottom: 0; }
        .result { margin-top: 20px; display: none; }
        .result.show { display: block; }
        .result textarea { min-height: 300px; font-size: 0.85em; }
        .color-picker { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.2s;
        }
        .color-option:hover { transform: scale(1.1); }
        .color-option.selected { border-color: #fff; }
        .loading { text-align: center; padding: 20px; color: #00d9ff; display: none; }
        .loading.show { display: block; }
        .error {
            background: rgba(255,100,100,0.2);
            border: 1px solid #ff6464;
            border-radius: 10px;
            padding: 15px;
            color: #ff6464;
            margin-bottom: 15px;
            display: none;
        }
        .error.show { display: block; }
        .video-count { color: #00ff88; font-weight: bold; }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .checkbox-label input { width: auto; margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 YT 學習網頁生成器</h1>
        <p class="subtitle">輸入播放清單網址，自動生成學習網頁（支援筆記功能）</p>

        <div class="card">
            <h2>🔗 從播放清單獲取</h2>
            <label>YouTube 播放清單網址</label>
            <input type="text" id="playlistUrl" placeholder="例如：https://youtube.com/playlist?list=PL50eMVAu4GRZacyHrLPx6aeZorN9roeQF">
            <button class="btn" id="fetchBtn" onclick="fetchPlaylist()">🔍 獲取播放清單</button>
            <div class="loading" id="loading">載入中... 請稍候</div>
            <div class="error" id="error"></div>
        </div>

        <div class="card">
            <h2>📝 課程資訊（自動填入，可修改）</h2>
            <label>課程名稱</label>
            <input type="text" id="courseName" placeholder="例如：喚醒心力·重構心智">

            <label>課程副標題（可選）</label>
            <input type="text" id="courseSubtitle" placeholder="例如：郭春林 | 25堂必修課">

            <label>主題顏色</label>
            <div class="color-picker" id="colorPicker">
                <div class="color-option selected" style="background: linear-gradient(135deg, #00d9ff, #00ff88)" data-color="00d9ff,00ff88"></div>
                <div class="color-option" style="background: linear-gradient(135deg, #ff6b6b, #feca57)" data-color="ff6b6b,feca57"></div>
                <div class="color-option" style="background: linear-gradient(135deg, #a29bfe, #fd79a8)" data-color="a29bfe,fd79a8"></div>
                <div class="color-option" style="background: linear-gradient(135deg, #00b894, #00cec9)" data-color="00b894,00cec9"></div>
                <div class="color-option" style="background: linear-gradient(135deg, #e17055, #fdcb6e)" data-color="e17055,fdcb6e"></div>
                <div class="color-option" style="background: linear-gradient(135deg, #6c5ce7, #a29bfe)" data-color="6c5ce7,a29bfe"></div>
                <div class="color-option" style="background: linear-gradient(135deg, #e84393, #fd79a8)" data-color="e84393,fd79a8"></div>
                <div class="color-option" style="background: linear-gradient(135deg, #00cec9, #81ecec)" data-color="00cec9,81ecec"></div>
            </div>

            <label class="checkbox-label">
                <input type="checkbox" id="enableNotes" checked>
                啟用筆記功能
            </label>
        </div>

        <div class="card">
            <h2>🎥 影片列表（<span class="video-count" id="videoCount">0</span> 部）</h2>
            <label>每行一部，格式：<code>影片ID|標題|章節（可選）</code></label>
            <textarea id="videoList" placeholder="從播放清單獲取後會自動填入...或手動輸入"></textarea>
            <button class="btn" onclick="generateHTML()">✨ 生成 HTML</button>
        </div>

        <div class="card result" id="resultCard">
            <h2>📄 生成的 HTML</h2>
            <textarea id="outputHTML" readonly></textarea>
            <div class="btn-row">
                <button class="btn btn-secondary" onclick="copyHTML()">📋 複製 HTML</button>
                <button class="btn btn-secondary" onclick="downloadHTML()">💾 下載 HTML</button>
            </div>
        </div>
    </div>

    <script>
        let selectedColor = '00d9ff,00ff88';
        let fetchedVideos = [];

        // 顏色選擇
        document.querySelectorAll('.color-option').forEach(opt => {
            opt.addEventListener('click', () => {
                document.querySelectorAll('.color-option').forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                selectedColor = opt.dataset.color;
            });
        });

        // 從播放清單獲取影片
        async function fetchPlaylist() {
            const url = document.getElementById('playlistUrl').value.trim();
            if (!url) {
                showError('請輸入播放清單網址');
                return;
            }

            const playlistId = extractPlaylistId(url);
            if (!playlistId) {
                showError('無法解析播放清單 ID，請檢查網址是否正確');
                return;
            }

            showLoading(true);
            hideError();

            try {
                const instances = [
                    'https://invidious.jingl.xyz',
                    'https://invidious.privacydev.net',
                    'https://invidious.snopyta.org',
                    'https://yewtu.be'
                ];

                let videos = null;

                for (const instance of instances) {
                    try {
                        videos = await fetchFromInstance(instance, playlistId);
                        if (videos && videos.length > 0) break;
                    } catch (e) {
                        continue;
                    }
                }

                if (!videos || videos.length === 0) {
                    showError('無法獲取播放清單，請稍後再試或手動輸入');
                    return;
                }

                fetchedVideos = videos;
                document.getElementById('videoList').value = videos.map(v => `${v.id}|${v.title}|${v.chapter || ''}`).join('\n');
                document.getElementById('videoCount').textContent = videos.length;

                if (!document.getElementById('courseName').value) {
                    const playlistTitle = videos[0]?.playlistTitle || '';
                    if (playlistTitle) {
                        document.getElementById('courseName').value = playlistTitle.split('｜')[0].split('|')[0].trim();
                    }
                }

            } catch (err) {
                showError('獲取失敗: ' + err.message);
            } finally {
                showLoading(false);
            }
        }

        async function fetchFromInstance(instance, playlistId) {
            const response = await fetch(`${instance}/api/v1/playlists/${playlistId}`);
            if (!response.ok) throw new Error('API 請求失敗');

            const data = await response.json();
            if (!data.videos) return [];

            return data.videos.map((v, i) => ({
                id: v.videoId,
                title: v.title,
                chapter: v.title.match(/^[\d\-\.]+\s*(.+)/)?.[1] || `第${i+1}集`,
                playlistTitle: data.title
            }));
        }

        function extractPlaylistId(url) {
            const match = url.match(/[?&]list=([a-zA-Z0-9_-]+)/);
            return match ? match[1] : null;
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('show', show);
            document.getElementById('fetchBtn').disabled = show;
        }

        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.classList.add('show');
        }

        function hideError() {
            document.getElementById('error').classList.remove('show');
        }

        function generateHTML() {
            const courseName = document.getElementById('courseName').value || '課程學習';
            const courseSubtitle = document.getElementById('courseSubtitle').value || '';
            const videoText = document.getElementById('videoList').value.trim();
            const enableNotes = document.getElementById('enableNotes').checked;

            if (!videoText) {
                alert('請輸入影片列表或從播放清單獲取');
                return;
            }

            const videos = [];
            const lines = videoText.split('\n');
            lines.forEach(line => {
                line = line.trim();
                if (!line) return;

                const parts = line.split('|');
                const id = parts[0].trim();
                const title = parts[1] ? parts[1].trim() : `影片 ${videos.length + 1}`;
                const chapter = parts[2] ? parts[2].trim() : '';

                if (id) {
                    videos.push({ id, title, chapter });
                }
            });

            if (videos.length === 0) {
                alert('無法解析影片列表，請檢查格式');
                return;
            }

            const [c1, c2] = selectedColor.split(',');
            const slug = courseName.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase().substring(0, 20);

            // 筆記功能相關的 HTML/JS
            const notesCSS = enableNotes ? `
        .notes-panel { display: none; background: rgba(0,0,0,0.3); border-radius: 10px; padding: 15px; margin-top: 10px; }
        .notes-panel.show { display: block; }
        .notes-panel textarea { width: 100%; min-height: 150px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 10px; color: #fff; font-size: 0.9em; resize: vertical; }
        .notes-panel textarea::placeholder { color: #888; }
        .notes-count { font-size: 0.8em; color: #888; }
        .notes-btn { background: rgba(255,200,0,0.2); border: 1px solid #ffc800; color: #ffc800; padding: 5px 12px; border-radius: 15px; cursor: pointer; font-size: 0.85em; margin-left: 10px; }` : '';

            const notesJS = enableNotes ? `
        let videoNotes = JSON.parse(localStorage.getItem(STORAGE_KEY + '-notes') || '{}');

        function toggleNotes(index) {{
            const panel = document.getElementById('notes-' + index);
            if (panel.style.display === 'block') {{
                panel.style.display = 'none';
            }} else {{
                // 隱藏其他筆記面板
                document.querySelectorAll('.notes-panel').forEach(p => p.style.display = 'none');
                panel.style.display = 'block';
            }}
        }}

        function saveNote(index) {{
            const note = document.getElementById('note-' + index).value;
            videoNotes[videos[index].id] = note;
            localStorage.setItem(STORAGE_KEY + '-notes', JSON.stringify(videoNotes));
            updateNotesCount();
        }}

        function updateNotesCount() {{
            const count = Object.keys(videoNotes).filter(k => videoNotes[k] && videoNotes[k].trim()).length;
            document.getElementById('notesCount').textContent = count;
        }}

        const notesBtnHtml = '<button class="notes-btn" onclick="toggleNotes(' + i + ')">📝 筆記</button>';
        const notesPanelHtml = '<div class="notes-panel" id="notes-' + i + '" style="display:none"><textarea id="note-' + i + '" placeholder="在這裡記錄筆記...' + v.title + '">' + (videoNotes[v.id] || '') + '</textarea><button class="btn" style="margin-top:10px;padding:10px" onclick="saveNote(' + i + ')">💾 儲存筆記</button></div>';` : '';

            const videoItemHTML = enableNotes ?
                `'<div class="video-item ' + (completedVideos.includes(v.id) ? 'completed' : '') + '" onclick="toggleComplete(' + i + ')"><div class="video-number">' + (i+1) + '</div><div class="video-info"><div class="video-title">' + v.title + '</div><div class="video-chapter">' + v.chapter + '</div>' + notesPanelHtml + '</div><a href="https://youtu.be/' + v.id + '" target="_blank" class="video-link" onclick="event.stopPropagation()">▶ 看影片</a>' + notesBtnHtml + '<div class="check-btn"></div></div>'` :
                `'<div class="video-item ' + (completedVideos.includes(v.id) ? 'completed' : '') + '" onclick="toggleComplete(' + i + ')"><div class="video-number">' + (i+1) + '</div><div class="video-info"><div class="video-title">' + v.title + '</div><div class="video-chapter">' + v.chapter + '</div></div><a href="https://youtu.be/' + v.id + '" target="_blank" class="video-link" onclick="event.stopPropagation()">▶ 看影片</a><div class="check-btn"></div></div>'`;

            const html = `<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${courseName}｜學習中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; color: #fff; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 40px 20px; background: rgba(255,255,255,0.05); border-radius: 20px; margin-bottom: 30px; backdrop-filter: blur(10px); }
        h1 { font-size: 2.2em; margin-bottom: 10px; background: linear-gradient(90deg, #${c1}, #${c2}); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { font-size: 1.1em; color: #aaa; margin-bottom: 20px; }
        .stats { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; margin-top: 20px; }
        .stat-item { text-align: center; }
        .stat-number { font-size: 2em; font-weight: bold; color: #${c1}; }
        .stat-label { font-size: 0.9em; color: #888; }
        .progress-section { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 20px; margin-bottom: 30px; }
        .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .progress-bar { height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #${c1}, #${c2}); border-radius: 5px; transition: width 0.3s ease; }
        .video-list { display: grid; gap: 15px; }
        .video-item { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 15px 20px; display: flex; align-items: flex-start; gap: 15px; transition: all 0.3s ease; cursor: pointer; border: 2px solid transparent; flex-wrap: wrap; }
        .video-item:hover { background: rgba(255,255,255,0.12); transform: translateX(5px); }
        .video-item.completed { border-color: #${c2}; background: rgba(255,255,255,0.1); }
        .video-item.completed .video-number { background: #${c2}; color: #1a1a2e; }
        .video-number { width: 35px; height: 35px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        .video-info { flex: 1; min-width: 200px; }
        .video-title { font-size: 1em; margin-bottom: 5px; color: #fff; }
        .video-chapter { font-size: 0.8em; color: #888; }
        .video-link { color: #${c1}; text-decoration: none; padding: 8px 15px; background: rgba(255,255,255,0.1); border-radius: 20px; font-size: 0.85em; transition: all 0.3s ease; white-space: nowrap; }
        .video-link:hover { background: rgba(255,255,255,0.2); }
        .check-btn { width: 28px; height: 28px; border: 2px solid #555; border-radius: 50%; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .check-btn:hover { border-color: #${c2}; }
        .video-item.completed .check-btn { background: #${c2}; border-color: #${c2}; }
        .check-btn::after { content: "✓"; color: #1a1a2e; font-weight: bold; display: none; }
        .video-item.completed .check-btn::after { display: block; }
        footer { text-align: center; padding: 30px; color: #666; font-size: 0.9em; }
        .reset-btn { background: rgba(255,100,100,0.2); border: 1px solid #ff6464; color: #ff6464; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 0.9em; margin-top: 20px; }
        .export-btn { background: rgba(0,150,255,0.2); border: 1px solid #0096ff; color: #0096ff; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 0.9em; margin-top: 20px; margin-left: 10px; }
        ${notesCSS}
        @media (max-width: 600px) { h1 { font-size: 1.6em; } .stats { gap: 20px; } .video-item { flex-wrap: wrap; } .video-link { margin-top: 10px; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>${courseName}</h1>
            <p class="subtitle">${courseSubtitle}</p>
            <div class="stats">
                <div class="stat-item"><div class="stat-number" id="totalVideos">${videos.length}</div><div class="stat-label">總影片數</div></div>
                <div class="stat-item"><div class="stat-number" id="completedCount">0</div><div class="stat-label">已完成</div></div>
                <div class="stat-item"><div class="stat-number" id="progressPercent">0%</div><div class="stat-label">學習進度</div></div>
                ${enableNotes ? '<div class="stat-item"><div class="stat-number" id="notesCount">0</div><div class="stat-label">筆記數</div></div>' : ''}
            </div>
        </header>
        <div class="progress-section">
            <div class="progress-header"><span>學習進度</span><span id="progressText">0 / ${videos.length}</span></div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
        </div>
        <div class="video-list" id="videoList"></div>
        <footer>
            <p>點擊圓圈可標記已完成 ${enableNotes ? '| 點擊筆記按鈕可寫筆記' : ''}</p>
            <button class="reset-btn" onclick="resetProgress()">重置進度</button>
            ${enableNotes ? '<button class="export-btn" onclick="exportNotes()">📤 匯出筆記</button>' : ''}
        </footer>
    </div>
    <script>
        const videos = ${JSON.stringify(videos)};
        const STORAGE_KEY = 'gcl-${slug}-completed';
        let completedVideos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        ${enableNotes ? `let videoNotes = JSON.parse(localStorage.getItem(STORAGE_KEY + '-notes') || '{}');` : ''}

        function saveProgress() { localStorage.setItem(STORAGE_KEY, JSON.stringify(completedVideos)); updateStats(); }
        
        ${enableNotes ? `
        function toggleNotes(index) {
            const panel = document.getElementById('notes-' + index);
            document.querySelectorAll('.notes-panel').forEach(p => p.style.display = 'none');
            if (panel.style.display === 'block') {
                panel.style.display = 'none';
            } else {
                panel.style.display = 'block';
            }
        }

        function saveNote(index) {
            const note = document.getElementById('note-' + index).value;
            videoNotes[videos[index].id] = note;
            localStorage.setItem(STORAGE_KEY + '-notes', JSON.stringify(videoNotes));
            alert('筆記已儲存！');
        }

        function updateNotesCount() {
            const count = Object.keys(videoNotes).filter(k => videoNotes[k] && videoNotes[k].trim()).length;
            document.getElementById('notesCount').textContent = count;
        }

        function exportNotes() {
            let text = '# ${courseName} 筆記\\n\\n';
            videos.forEach((v, i) => {
                const note = videoNotes[v.id] || '';
                if (note.trim()) {
                    text += '## ' + (i+1) + '. ' + v.title + '\\n';
                    text += note + '\\n\\n';
                }
            });
            
            const blob = new Blob([text], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '${slug}-notes.md';
            a.click();
        }
        ` : ''}

        function toggleComplete(index) { const id = videos[index].id; completedVideos.includes(id) ? completedVideos = completedVideos.filter(x => x !== id) : completedVideos.push(id); saveProgress(); renderList(); }
        function updateStats() { document.getElementById('completedCount').textContent = completedVideos.length; document.getElementById('progressText').textContent = completedVideos.length + ' / ' + videos.length; const p = Math.round(completedVideos.length / videos.length * 100); document.getElementById('progressPercent').textContent = p + '%'; document.getElementById('progressFill').style.width = p + '%'; ${enableNotes ? 'updateNotesCount();' : ''} }
        
        function renderList() { 
            document.getElementById('videoList').innerHTML = videos.map((v, i) => {
                ${enableNotes ? `
                const notesPanel = '<div class="notes-panel" id="notes-' + i + '" style="display:none"><textarea id="note-' + i + '" placeholder="在這裡記錄筆記...">' + (videoNotes[v.id] || '').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</textarea><button class="btn" style="margin-top:10px;padding:10px;width:100%" onclick="saveNote(' + i + ')">💾 儲存筆記</button></div>';
                const notesBtn = '<button class="notes-btn" style="background:rgba(255,200,0,0.2);border:1px solid #ffc800;color:#ffc800;padding:5px 12px;border-radius:15px;cursor:pointer;font-size:0.85em;margin-left:10px" onclick="event.stopPropagation();toggleNotes(' + i + ')">📝 筆記</button>';
                return '<div class="video-item ' + (completedVideos.includes(v.id) ? 'completed' : '') + '" onclick="toggleComplete(' + i + ')"><div class="video-number">' + (i+1) + '</div><div class="video-info"><div class="video-title">' + v.title.replace(/'/g, "\\'") + '</div><div class="video-chapter">' + (v.chapter || '') + '</div>' + notesPanel + '</div><a href="https://youtu.be/' + v.id + '" target="_blank" class="video-link" onclick="event.stopPropagation()">▶ 看影片</a>' + notesBtn + '<div class="check-btn"></div></div>';
                ` : `
                return '<div class="video-item ' + (completedVideos.includes(v.id) ? 'completed' : '') + '" onclick="toggleComplete(' + i + ')"><div class="video-number">' + (i+1) + '</div><div class="video-info"><div class="video-title">' + v.title.replace(/'/g, "\\'") + '</div><div class="video-chapter">' + (v.chapter || '') + '</div></div><a href="https://youtu.be/' + v.id + '" target="_blank" class="video-link" onclick="event.stopPropagation()">▶ 看影片</a><div class="check-btn"></div></div>';
                `}
            }).join(''); 
            updateStats(); 
        }
        
        function resetProgress() { if(confirm('確定重置？這也會刪除所有筆記')) { completedVideos = []; ${enableNotes ? "videoNotes = {}; localStorage.setItem(STORAGE_KEY + '-notes', '{}');" : ''} saveProgress(); renderList(); } }
        renderList();
    <\/script>
</body>
</html>`;

            document.getElementById('outputHTML').value = html;
            document.getElementById('resultCard').classList.add('show');
        }

        function copyHTML() {
            const textarea = document.getElementById('outputHTML');
            textarea.select();
            document.execCommand('copy');
            alert('已複製到剪貼簿！');
        }

        function downloadHTML() {
            const html = document.getElementById('outputHTML').value;
            const courseName = document.getElementById('courseName').value || ' study';
            const filename = courseName.replace(/[^a-zA-Z0-9]/g, '-') + '.html';

            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
