<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哲學智慧｜學習中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; color: #fff; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px 20px; background: rgba(255,255,255,0.05); border-radius: 20px; margin-bottom: 30px; backdrop-filter: blur(10px); }
        h1 { font-size: 2em; margin-bottom: 10px; background: linear-gradient(90deg, #ff6b6b, #feca57); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { font-size: 1em; color: #aaa; margin-bottom: 15px; }
        .stats { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-top: 15px; }
        .stat-item { text-align: center; }
        .stat-number { font-size: 1.5em; font-weight: bold; color: #ff6b6b; }
        .stat-label { font-size: 0.8em; color: #888; }
        .progress-section { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 15px; margin-bottom: 30px; }
        .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.9em; }
        .progress-bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ff6b6b, #feca57); border-radius: 4px; transition: width 0.3s ease; }
        
        .video-item { 
            background: rgba(255,255,255,0.08); 
            border-radius: 12px; 
            padding: 15px; 
            margin-bottom: 12px; 
            cursor: pointer; 
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        .video-item:hover { background: rgba(255,255,255,0.12); }
        .video-item.completed { border-color: #feca57; background: rgba(254,202,87,0.1); }
        
        .video-header { display: flex; align-items: center; gap: 12px; }
        .video-number { 
            width: 32px; height: 32px; 
            background: rgba(255,255,255,0.15); 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; font-size: 0.9em;
            flex-shrink: 0; 
        }
        .video-item.completed .video-number { background: #feca57; color: #1a1a2e; }
        
        .video-title { flex: 1; font-size: 0.95em; }
        
        .video-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        
        .video-link { 
            color: #ff6b6b; text-decoration: none; 
            padding: 6px 12px; background: rgba(255,255,255,0.1); 
            border-radius: 15px; font-size: 0.8em; 
        }
        
        .notes-btn { 
            background: rgba(255,200,0,0.2); border: 1px solid #ffc800; 
            color: #ffc800; padding: 6px 12px; 
            border-radius: 15px; cursor: pointer; font-size: 0.8em; 
        }
        
        .check-btn { 
            width: 26px; height: 26px; 
            border: 2px solid #555; border-radius: 50%; 
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .video-item.completed .check-btn { background: #feca57; border-color: #feca57; }
        .video-item.completed .check-btn::after { content: "✓"; color: #1a1a2e; font-weight: bold; font-size: 0.8em; }
        
        .notes-panel { 
            display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); 
        }
        .notes-panel.show { display: block; }
        .notes-panel textarea { 
            width: 100%; height: 120px; 
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 8px; padding: 10px; color: #fff; font-size: 0.9em; 
            resize: vertical; font-family: inherit;
        }
        .notes-panel .save-btn { 
            background: linear-gradient(90deg, #ff6b6b, #feca57); 
            border: none; padding: 8px 16px; border-radius: 8px; 
            color: #1a1a2e; font-weight: bold; cursor: pointer; margin-top: 8px; 
        }
        
        footer { text-align: center; padding: 20px; color: #666; font-size: 0.9em; }
        .reset-btn { background: rgba(255,100,100,0.2); border: 1px solid #ff6464; color: #ff6464; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 0.9em; }
        .export-btn { background: rgba(0,150,255,0.2); border: 1px solid #0096ff; color: #0096ff; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 0.9em; margin-left: 10px; }
        
        @media (max-width: 600px) { 
            h1 { font-size: 1.5em; } 
            .stats { gap: 15px; } 
            .video-header { flex-wrap: wrap; }
            .video-actions { margin-top: 10px; width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 哲學智慧</h1>
            <p class="subtitle">郭春林 | 45部影片</p>
            <div class="stats">
                <div class="stat-item"><div class="stat-number" id="totalVideos">45</div><div class="stat-label">總影片數</div></div>
                <div class="stat-item"><div class="stat-number" id="completedCount">0</div><div class="stat-label">已完成</div></div>
                <div class="stat-item"><div class="stat-number" id="progressPercent">0%</div><div class="stat-label">學習進度</div></div>
                <div class="stat-item"><div class="stat-number" id="notesCount">0</div><div class="stat-label">筆記數</div></div>
            </div>
        </header>
        
        <div class="progress-section">
            <div class="progress-header"><span>學習進度</span><span id="progressText">0 / 45</span></div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
        </div>
        
        <div id="videoList"></div>
        
        <footer>
            <p>點擊圓圈標記完成 | 點擊筆記按鈕寫筆記</p>
            <button class="reset-btn" onclick="resetProgress()">重置進度</button>
            <button class="export-btn" onclick="exportNotes()">📤 匯出筆記</button>
        </footer>
    </div>

备的4大特质 || 013-02第十三部分：精英引领-2.精英的四个基本特征", "chapter": ""}, {"id": "M7Djyosjk8Q", "title": "精英思维揭秘：你与成功人士的差距在哪？ || 013-03第十三部分：精英引领-3.精英的八个心智特征", "chapter": ""}, {"id": "-XPLkYBrHXI", "title": "哲学智慧：终极探究与心的力量，何为"唯心所变"？ || 014-01第十四部分：终极探究-1.化识转智", "chapter": ""}, {"id": "GXQwobZvhwk", "title": "什么是智慧的境界？哲学教授带你顿悟 || 014-02第十四部分：探究-2.", "chapter": ""}, {"id": "qd0ZvyRcEZg", "title": "揭秘"慧根"：聪明不是慧根，利他之心才是！ || 014-03第十四部分：探究-3.", "chapter": ""}];
        
        const STORAGE_KEY = 'gcl-philosophy-completed-v2';
        let completedVideos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        let videoNotes = JSON.parse(localStorage.getItem(STORAGE_KEY + '-notes') || '{}');

        function saveAll() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(completedVideos));
            localStorage.setItem(STORAGE_KEY + '-notes', JSON.stringify(videoNotes));
            updateStats();
        }

        function toggleNotes(idx) {
            const panel = document.getElementById('notes-' + idx);
            if (panel.style.display === 'block') {
                panel.style.display = 'none';
            } else {
                panel.style.display = 'block';
            }
        }

        function saveNote(idx) {
            const note = document.getElementById('note-' + idx).value;
            videoNotes[videos[idx].id] = note;
            localStorage.setItem(STORAGE_KEY + '-notes', JSON.stringify(videoNotes));
            alert('筆記已儲存！');
        }

        function updateNotesCount() {
            const count = Object.keys(videoNotes).filter(k => videoNotes[k] && videoNotes[k].trim()).length;
            document.getElementById('notesCount').textContent = count;
        }

        function exportNotes() {
            let text = '# 哲學智慧 筆記\n\n';
            videos.forEach((v, i) => {
                const note = videoNotes[v.id] || '';
                if (note.trim()) {
                    text += '## ' + (i+1) + '. ' + v.title + '\n';
                    text += note + '\n\n';
                }
            });
            if (text === '# 哲學智慧 筆記\n\n') {
                alert('目前沒有筆記');
                return;
            }
            const blob = new Blob([text], { type: 'text/markdown' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'philosophy-notes.md';
            a.click();
        }

        function toggleComplete(idx) {
            const id = videos[idx].id;
            if (completedVideos.includes(id)) {
                completedVideos = completedVideos.filter(x => x !== id);
            } else {
                completedVideos.push(id);
            }
            saveAll();
            render();
        }

        function updateStats() {
            document.getElementById('completedCount').textContent = completedVideos.length;
            document.getElementById('progressText').textContent = completedVideos.length + ' / ' + videos.length;
            const p = Math.round(completedVideos.length / videos.length * 100);
            document.getElementById('progressPercent').textContent = p + '%';
            document.getElementById('progressFill').style.width = p + '%';
            updateNotesCount();
        }

        function render() {
            const list = document.getElementById('videoList');
            list.innerHTML = videos.map((v, i) => {
                const isDone = completedVideos.includes(v.id);
                const noteVal = (videoNotes[v.id] || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                return '<div class="video-item ' + (isDone ? 'completed' : '') + '" onclick="toggleComplete(' + i + ')">' +
                    '<div class="video-header">' +
                        '<div class="video-number">' + (i+1) + '</div>' +
                        '<div class="video-title">' + v.title + '</div>' +
                        '<div class="video-actions">' +
                            '<a href="https://youtu.be/' + v.id + '" target="_blank" class="video-link" onclick="event.stopPropagation()">▶</a>' +
                            '<button class="notes-btn" onclick="event.stopPropagation();toggleNotes(' + i + ')">📝</button>' +
                            '<div class="check-btn"></div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="notes-panel" id="notes-' + i + '">' +
                        '<textarea id="note-' + i + '" placeholder="在這裡記錄筆記...">' + noteVal + '</textarea>' +
                        '<button class="save-btn" onclick="saveNote(' + i + ')">💾 儲存筆記</button>' +
                    '</div>' +
                '</div>';
            }).join('');
            updateStats();
        }

        function resetProgress() {
            if(confirm('確定重置？這也會刪除所有筆記')) {
                completedVideos = [];
                videoNotes = {};
                saveAll();
                render();
            }
        }

        render();
    </script>
</body>
